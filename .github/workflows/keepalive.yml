name: Keep database awake
# Supabase pauses free projects after a week without activity. This pings it every 3 days.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://stnspztabuxfylcuskho.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_x3U_3sfLDxhm6DF9OLcjTg_DsyrTnY5" \
            -H "Content-Type: application/json" -d '{}'
