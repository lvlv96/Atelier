<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VL Atelier</title>
<meta name="description" content="A private wardrobe: catalogue pieces, build outfits, plan what to wear.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VL Atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131A" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app — header, scrolling wardrobe grid, bottom tab bar; sheets slide up from the bottom. Pieces sit on "tile" grounds with a swing-tag label. */
:root{
  --ground:#EDECF0; --surface:#FAF9FB; --tile:#FFFFFF; --ink:#241B28; --muted:#6C6273;
  --line:#D5D0DB; --accent:#8C3A5D; --accent-ink:#FFFFFF; --accent-soft:#F0DCE5;
  --check-a:#F4F3F6; --check-b:#E6E3EA; --scrim:rgba(20,14,22,.42); --shadow:rgba(36,27,40,.14);
  --danger:#A6322B;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#17131A; --surface:#211B25; --tile:#2B2430; --ink:#F1ECF3; --muted:#A99FAF;
  --line:#3A3240; --accent:#E08AAF; --accent-ink:#1C1220; --accent-soft:#3B2533;
  --check-a:#262029; --check-b:#2F2833; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
  --danger:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#17131A; --surface:#211B25; --tile:#2B2430; --ink:#F1ECF3; --muted:#A99FAF;
  --line:#3A3240; --accent:#E08AAF; --accent-ink:#1C1220; --accent-soft:#3B2533;
  --check-a:#262029; --check-b:#2F2833; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
  --danger:#F08A80; color-scheme:dark}

html,body{height:100%}
html{touch-action:manipulation}
.stage.drawing{touch-action:none;overflow:hidden}
.stage.tall.drawing{height:60vh}
.stage.drawing canvas{transition:none;will-change:transform}
.zoomrow{display:flex;align-items:center;justify-content:center;gap:10px}
.zoomrow .btn{height:38px;min-width:44px;padding:0 12px;font-size:18px}
.zoomrow .btn.ghost{font-size:14px}
.zoomrow span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{margin:0;font:500 30px/1 var(--display);letter-spacing:-.01em}
.brand em{font-style:italic;color:var(--accent)}
.tagline{margin-top:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.view[hidden]{display:none}

/* search + chips */
.search{display:flex;gap:8px;margin:4px 0 10px}
.search input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);padding:0 16px}
.search .icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.dim{opacity:.45}
.chip.flag{border-color:var(--accent);color:var(--accent)}
.chip.flag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips.sub .chip{height:30px;font-size:12px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;display:grid;gap:10px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* swatches */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--accent)}
.sw.multi{background:conic-gradient(#d9534f,#f0ad4e,#5cb85c,#5bc0de,#7b5ea7,#d9534f)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .pic{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);background:var(--tile);display:grid;place-items:center;overflow:hidden;position:relative}
.card .pic img{max-width:82%;max-height:84%;object-fit:contain;filter:drop-shadow(0 6px 10px var(--shadow))}
.card .tag{display:flex;flex-direction:column;min-width:0;padding:0 2px}
.card .tag b{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .tag span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.dense{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.dense .tag b{font-size:12px}.grid.dense .tag span{font-size:10.5px}
.grid.dense .card .pic{border-radius:10px}
.layout{display:flex;border:1px solid var(--line);border-radius:21px;background:var(--surface);overflow:hidden;flex:none}
.layout button{width:38px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.layout button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent)}
.layout svg{width:17px;height:17px}
.catlist{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.catrow{display:flex;align-items:center;gap:12px;padding:8px 12px;background:none;border:0;text-align:left;min-width:0}
.catrow+.catrow{border-top:1px solid var(--line)}
.catrow .cthumb{width:44px;height:52px;border-radius:8px;background:var(--ground);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.catrow .cthumb img{max-width:84%;max-height:84%;object-fit:contain}
.catrow b{font-weight:500;font-size:15px;display:block}
.catrow small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .ctext{flex:1;min-width:0}
.catrow svg{width:16px;height:16px;color:var(--muted);flex:none}
.catrow.dim{opacity:.5}
.badge{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--surface);color:var(--muted);padding:3px 7px;border-radius:6px}
.badge.todo{background:var(--accent);color:var(--accent-ink)}
.fav{position:absolute;top:8px;right:9px;color:var(--accent);font-size:15px}

/* empty */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;margin-top:8px;display:grid;gap:14px}
.empty h2{margin:0;font:500 26px/1.15 var(--display);text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.stack{display:grid;gap:8px}
.btn{height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);padding:0 20px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.note{font-size:12.5px;color:var(--muted)}

/* tab bar */
.tabs{display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 2px;flex:1;min-width:0;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab-add{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px var(--shadow)}
.tab-add svg{width:26px;height:26px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px var(--shadow);animation:up .26s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font:500 22px/1.1 var(--display)}
.sheet-body{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font-weight:500;padding:8px 4px}

.stage{aspect-ratio:1;max-width:100%;max-height:44vh;margin:0 auto;width:100%;border-radius:var(--r);background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/22px 22px;display:grid;place-items:center;overflow:hidden;position:relative}
.stage img{max-width:90%;max-height:90%;object-fit:contain}
.stage .busy{position:absolute;inset:auto 10px 10px auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);padding:4px 8px;border-radius:6px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);flex:1;min-width:120px}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea{width:100%;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ground);padding:0 12px;font-size:16px}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.suggest{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink)}

.pane{display:grid;gap:14px}
.steps{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:500;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.stage.tall{aspect-ratio:auto;height:52vh;max-height:none}
.stage canvas{max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;display:block;border-radius:8px}
.stage.drawing{background:var(--tile)}
.hint-line{font-size:13px;color:var(--muted);margin:0;text-align:center;min-height:1.4em}
.dhead{display:flex;gap:12px;align-items:center}
.dhead .thumb{width:76px;height:92px;flex:none;border-radius:12px;background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/14px 14px;display:grid;place-items:center;overflow:hidden}
.dhead .thumb img{max-width:86%;max-height:86%;object-fit:contain}
.dhead .field{flex:1;min-width:0}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.catgrid .chip{justify-content:center;padding:6px;height:auto;min-height:40px;white-space:normal;text-align:center;line-height:1.2;font-size:13px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:12.5px}
.seg.two-seg{grid-template-columns:1fr 1fr}
.seg .n{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.listseg{margin:2px 0 10px}
.sizerow{flex-basis:100%;display:flex;gap:10px;align-items:center}
.sizerow input{flex:1}
.bgrow{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw.custom{overflow:hidden;background:conic-gradient(#d9534f,#f0ad4e,#5cb85c,#5bc0de,#7b5ea7,#d9534f);display:grid}
.sw.custom input{opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.tray-item{position:relative}
.tray-item .w{position:absolute;top:3px;right:6px;color:var(--accent);font-size:12px}
.facts a{color:var(--accent)}
/* dress me */
main.fixed{overflow:hidden;display:flex;flex-direction:column}
#view-dress{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#view-dress[hidden]{display:none}
.dm-top{display:grid;gap:8px}
.dm-top .chips{padding-bottom:0}
#dm-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.dm-row{position:relative;min-height:56px;background:var(--tile);border-radius:var(--r);overflow:hidden;display:flex}
.dm-label{position:absolute;left:6px;top:3px;z-index:2;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:4px 6px;display:flex;align-items:center;gap:2px;border-radius:8px}
.dm-label svg{width:13px;height:13px}
.dm-label:active{background:var(--ground)}
.dm-search{position:relative;display:flex;align-items:center}
.dm-search svg{position:absolute;left:14px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.dm-search input{width:100%;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;font-size:16px}
.dm-results{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.dm-results::-webkit-scrollbar{display:none}
.dm-hit{flex:none;width:76px;display:grid;gap:3px;background:none;border:0;padding:0;text-align:left}
.dm-hit .ph{height:84px;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:grid;place-items:center}
.dm-hit img{max-width:80%;max-height:80%;object-fit:contain}
.dm-hit span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-none{font-size:13px;color:var(--muted);padding:8px 0}
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pickgrid .dm-hit{width:auto}
.pickgrid .dm-hit .ph{height:auto;aspect-ratio:4/5}
.pickgrid .dm-hit.on .ph{outline:2px solid var(--accent);outline-offset:-2px}
.dm-pin{position:absolute;right:6px;top:4px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.dm-pin svg{width:17px;height:17px}
.dm-pin[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dm-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.dm-track::-webkit-scrollbar{display:none}
.dm-item{flex:none;width:var(--iw,44%);height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:22px 0 8px}
.dm-item img{max-width:88%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 5px 8px var(--shadow));user-select:none;-webkit-user-select:none}
.dm-item.none span{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.dm-empty{margin:auto;font-size:13px;color:var(--muted)}
.dm-bar{display:flex;gap:8px;align-items:center}
.dm-bar .btn{height:44px;padding:0 12px;font-size:14px}
.dm-bar .grow{flex:1}
#dm-target-note{font-size:12.5px;color:var(--accent);display:flex;gap:8px;align-items:center}
/* planner */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.pnav h2{margin:0;font:500 24px/1 var(--display)}
.pweek,.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pweek span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.pcell{position:relative;aspect-ratio:3/4.4;max-width:100%;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0;overflow:hidden;display:flex;flex-direction:column}
.pcell.blank{border:0;background:none}
.pcell.past:not(.worn){opacity:.6}
.pcell.today{border:2px solid var(--accent)}
.pcell .pnum{position:absolute;top:3px;left:5px;font-size:11px;font-variant-numeric:tabular-nums;z-index:2;color:var(--muted)}
.pcell.today .pnum{color:var(--accent);font-weight:600}
.pcell .board.mini{position:absolute;inset:0;border-radius:0;aspect-ratio:auto}
.pcell.planned .board.mini{opacity:.75}
.board.mini .piece{filter:none}
.pcell.planned::after{content:"";position:absolute;inset:auto 4px 4px auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pkey{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.pkey .k{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.pkey .k.worn{background:var(--tile)}.pkey .k.planned{background:var(--accent)}
.stats{margin-top:22px;display:grid;gap:14px}
.stats h3{margin:0;font:500 22px/1.1 var(--display)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;text-align:left}
.tile b{font:500 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.act{border-color:var(--accent)}
.tile.act span{color:var(--accent)}
.slist{display:grid;gap:2px}
.srow{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left;min-width:0}
.srow+.srow{border-top:1px solid var(--line)}
.sthumb{width:40px;height:46px;border-radius:8px;background:var(--tile);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.sthumb img{max-width:84%;max-height:84%;object-fit:contain}
.sname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.sval{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.sval small{font-weight:400;color:var(--muted);font-size:11px}
.gridbar{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:13px;color:var(--muted);min-height:36px}
.gridbar .link{padding:6px 2px}
.gridbar span{flex:1}
.gridbar.sel{position:sticky;top:0;z-index:3;background:var(--ground);color:var(--ink);font-weight:500}
.gridbar.sel span{text-align:center}
.gridbar .btn{height:36px;padding:0 14px;font-size:13px}
.card .tick{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent}
.card .tick svg{width:15px;height:15px}
.card.picked .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.picked .pic{outline:2px solid var(--accent);outline-offset:-2px}
.photo-acts{display:flex;gap:8px;margin-top:-6px}
.photo-acts .btn{flex:1;height:38px;font-size:13.5px}
.gridbar.sel{flex-direction:column;align-items:stretch;gap:8px;padding:6px 0 8px}
.selrow{display:flex;align-items:center;gap:10px}
.selrow span{flex:1;text-align:center}
.selacts{display:flex;gap:8px}
.selacts .btn{flex:1;height:40px}
.toast.undo{display:flex;align-items:center;gap:16px;padding:8px 8px 8px 16px}
.toast.undo button{background:none;border:0;color:var(--accent-soft);font-weight:700;font-size:14px;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
.auth{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.auth-card{width:100%;max-width:380px;display:grid;gap:14px}
.auth-brand{font:500 40px/1 var(--display);margin-bottom:4px}
.auth-brand em{font-style:italic;color:var(--accent)}
.auth-card h2{margin:0;font:500 22px/1.2 var(--display);color:var(--muted)}
.auth-card .field input{background:var(--surface)}
.auth-msg{margin:0;color:var(--danger);font-size:14px}
#auth-switch{justify-self:center;font-weight:400;color:var(--muted)}
#auth-switch b{color:var(--accent);font-weight:600}
/* item detail */
.detail-pic{aspect-ratio:1;max-width:100%;border-radius:var(--r);background:var(--tile);display:grid;place-items:center}
.detail-pic img{max-width:84%;max-height:84%;object-fit:contain;filter:drop-shadow(0 10px 16px var(--shadow))}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.facts dt{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0;min-width:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}

/* outfits list */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.ogrid{grid-template-columns:1fr 1fr;gap:10px}}
.ocard{background:none;border:0;padding:0;text-align:left;display:grid;gap:6px;min-width:0}
.ocard b{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard small{font-size:11px;color:var(--muted)}
.board{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r);background:var(--tile);overflow:hidden}
.board .piece{position:absolute;height:auto;max-width:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;filter:drop-shadow(0 6px 8px var(--shadow))}
.actions{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}

/* builder */
.builder{position:fixed;inset:0;z-index:15;background:var(--ground);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.builder-inner{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;min-height:0}
.bhead{display:flex;align-items:center;gap:8px;padding:10px 16px}
.bhead input{flex:1;min-width:0;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;font:500 20px var(--display);padding:0 2px}
.bstage{flex:1;min-height:0;display:grid;place-items:center;padding:0 16px}
.bstage .board{height:100%;max-height:100%;width:auto;aspect-ratio:3/4;touch-action:none}
.bstage .piece{touch-action:none;cursor:grab}
.bstage .piece.sel{outline:2px dashed var(--accent);outline-offset:4px}
.btools{display:flex;align-items:center;gap:6px;padding:8px 16px;min-height:52px;flex-wrap:wrap}
.btools .btn{height:36px;padding:0 12px;font-size:13px}
.btools .hint{font-size:12.5px;color:var(--muted)}
.tray{background:var(--surface);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tray .chips{margin:0;padding-bottom:6px}
.tray-items{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tray-items::-webkit-scrollbar{display:none}
.tray-item{flex:none;width:72px;height:84px;border-radius:12px;border:1px solid var(--line);background:var(--tile);display:grid;place-items:center;padding:0}
.tray-item img{max-width:80%;max-height:80%;object-fit:contain}
.tray-empty{font-size:13px;color:var(--muted);padding:20px 16px}

/* toast + confirm */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 20px var(--shadow)}
.dressing .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.confirm{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--scrim);padding:16px}
.confirm-box{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%;display:grid;gap:14px}
.confirm-box p{margin:0}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.mode{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin:0 0 10px}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

</head>

<script>
/* ---------- reference data ---------- */
const CATS = [
  {id:'tops', label:'Tops', subs:['T-shirts','Shirts & blouses','Knitwear','Sweatshirts & hoodies','Vests & camis','Bodysuits']},
  {id:'bottoms', label:'Bottoms', subs:['Jeans','Trousers','Skirts','Shorts','Leggings']},
  {id:'dresses', label:'Dresses', subs:['Mini dresses','Midi dresses','Maxi dresses','Jumpsuits & playsuits']},
  {id:'outerwear', label:'Outerwear', subs:['Coats','Jackets','Blazers','Trench coats','Gilets']},
  {id:'shoes', label:'Shoes', subs:['Sneakers','Boots','Ankle boots','Heels','Flats','Sandals','Loafers','Mules']},
  {id:'bags', label:'Bags', subs:['Shoulder bags','Crossbody bags','Totes','Clutches','Backpacks']},
  {id:'accessories', label:'Accessories', subs:['Belts','Scarves','Hats','Sunglasses','Hair accessories']},
  {id:'jewellery', label:'Jewellery', subs:['Earrings','Necklaces','Bracelets','Rings','Watches']},
  {id:'swim', label:'Swim & beach', subs:['Swimsuits','Bikinis','Cover-ups']},
  {id:'active', label:'Activewear', subs:['Sports tops','Sports bottoms','Sets']},
  {id:'lounge', label:'Lounge & night', subs:['Loungewear','Pyjamas','Robes']},
];
const COLOURS = [
  ['black','Black','#111111'],['white','White','#FFFFFF'],['cream','Cream','#F2EAD8'],['grey','Grey','#9A9A9E'],
  ['beige','Beige','#D9C6A5'],['camel','Camel','#B98A55'],['brown','Brown','#6B4430'],['navy','Navy','#1F2A4D'],
  ['blue','Blue','#3B6FB6'],['lightblue','Light blue','#A9C8E8'],['green','Green','#3F7D4E'],['olive','Olive','#76733B'],
  ['yellow','Yellow','#E9C53F'],['orange','Orange','#E07B39'],['red','Red','#C0312B'],['burgundy','Burgundy','#6E1F30'],
  ['pink','Pink','#E8A3B8'],['purple','Purple','#6E4C93'],['gold','Gold','#C9A44C'],['silver','Silver','#C4C7CC'],
  ['multi','Print / multi',null]
];
const SEASONS = [['spring','Spring'],['summer','Summer'],['autumn','Autumn'],['winter','Winter']];
const OCCASIONS = [['everyday','Everyday'],['work','Work'],['evening','Evening'],['beach','Beach'],['sport','Sport'],['special','Special']];
const DEFAULT_W = {tops:.42,bottoms:.36,dresses:.44,outerwear:.48,shoes:.26,bags:.3,accessories:.22,jewellery:.15,swim:.36,active:.38,lounge:.42,'':.34};

const catById = id => CATS.find(c=>c.id===id);
const colourHex = id => (COLOURS.find(c=>c[0]===id)||[])[2];
const colourName = id => (COLOURS.find(c=>c[0]===id)||[,id])[1];
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- storage: a copy on this device (IndexedDB, one per account) kept in sync with Supabase ---------- */
const SB_URL='https://stnspztabuxfylcuskho.supabase.co';
const SB_KEY='sb_publishable_x3U_3sfLDxhm6DF9OLcjTg_DsyrTnY5';
const COLLS=['items','outfits','days'];
const Store = {
  mode:'loading', canWrite:true, items:new Map(), outfits:new Map(), days:new Map(), urls:new Map(), hiding:new Set(), onChange(){},
  idb:null, uid:null, email:'', pending:0, lastSync:0, syncError:'', loadingImg:new Set(),
  openDb(name){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(name,1);
      r.onupgradeneeded=()=>{const d=r.result;['items','outfits','days','blobs','outbox'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:n==='blobs'?'key':n==='outbox'?'k':'id'}))};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  },
  async start(uid,email){
    this.uid=uid; this.email=email||'';
    try{
      if(navigator.storage?.persist) await navigator.storage.persist().catch(()=>false);
      this.idb=await this.openDb('atelier-u-'+uid);
      const [items,outfits,days,outbox]=await Promise.all(COLLS.map(c=>this._all(c)).concat([this._all('outbox')]));
      this.items=new Map(items.map(i=>[i.id,i])); this.outfits=new Map(outfits.map(o=>[o.id,o])); this.days=new Map(days.map(d=>[d.id,d]));
      this.pending=outbox.length; this.mode='local';
    }catch(e){ this.mode='memory' }
  },
  _tx(store,mode){return this.idb.transaction(store,mode).objectStore(store)},
  _all(store){return new Promise((res,rej)=>{const r=this._tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  _put(store,v){ if(!this.idb) return Promise.resolve(); return new Promise((res,rej)=>{const r=this._tx(store,'readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  _del(store,k){ if(!this.idb) return Promise.resolve(); return new Promise((res,rej)=>{const r=this._tx(store,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  _get(store,k){ if(!this.idb) return Promise.resolve(undefined); return new Promise((res,rej)=>{const r=this._tx(store,'readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async putBlob(key,blob){ const buf=await blob.arrayBuffer(); await this._put('blobs',{key,buf,type:blob.type||'image/png'}) },
  async getBlob(key){ const r=await this._get('blobs',key); if(!r) return null; return r.blob || (r.buf ? new Blob([r.buf],{type:r.type||'image/png'}) : null) },
  async enqueue(coll,id,op){
    await this._put('outbox',{k:coll+':'+id,coll,id,op,at:Date.now()+Math.random()});
    this.pending=(await this._all('outbox')).length; Sync.soon();
  },
  async addImage(blob){
    const key=uid();
    await this.putBlob(key,blob);
    this.urls.set('l:'+key, URL.createObjectURL(blob));
    await this.enqueue('blobs',key,'put');
    return 'l:'+key;
  },
  imgUrl(ref){
    if(!ref) return '';
    if(this.urls.get(ref)) return this.urls.get(ref);
    if(ref.startsWith('l:') && !this.loadingImg.has(ref)){
      this.loadingImg.add(ref); const key=ref.slice(2);
      this.getBlob(key).then(async blob=>{
        if(!blob) blob=await Sync.fetchPhoto(key);
        if(blob){ this.urls.set(ref,URL.createObjectURL(blob)); this.onChange() }
      }).catch(()=>{}).finally(()=>this.loadingImg.delete(ref));
    }
    return '';
  },
  async dropImage(ref){
    if(!ref?.startsWith('l:')) return;
    const key=ref.slice(2);
    await this._del('blobs',key).catch(()=>{});
    await this.enqueue('blobs',key,'del');
  },
  async _save(coll,obj){
    const clean=JSON.parse(JSON.stringify({...obj,updatedAt:Date.now()}));
    await this._put(coll,clean); this[coll].set(clean.id,clean);
    await this.enqueue(coll,clean.id,'put'); this.changed();
  },
  async _remove(coll,id){
    await this._del(coll,id); this[coll].delete(id);
    await this.enqueue(coll,id,'del'); this.changed();
  },
  changed(){ try{ this.onChange() }catch(e){ console.error(e) } },
  putItem(it){return this._save('items',it)},
  async delItem(id){ const it=this.items.get(id); await this._remove('items',id); if(it) await this.dropImage(it.img) },
  putOutfit(o){return this._save('outfits',o)},
  delOutfit(id){return this._remove('outfits',id)},
  putDay(d){return this._save('days',d)},
  delDay(id){return this._remove('days',id)},
  list(){return [...this.items.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))},
};

const Sync = {
  sb:null, timer:null, busy:false, again:false,
  soon(ms=900){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.run(),ms) },
  async run(){
    if(!this.sb||!Store.uid||Store.mode!=='local') return;
    if(this.busy){ this.again=true; return }
    this.busy=true;
    try{ await this.push(); await this.pull(); Store.lastSync=Date.now(); Store.syncError='' }
    catch(e){ Store.syncError=navigator.onLine?'Sync paused — retrying shortly':'Offline — changes will sync when you’re back online'; this.soon(30000) }
    this.busy=false; renderSyncNote();
    if(this.again){ this.again=false; this.soon(300) }
  },
  async push(){
    const ops=(await Store._all('outbox')).sort((a,b)=>a.at-b.at);
    for(const op of ops){
      if(op.coll==='blobs'){
        const path=`${Store.uid}/${op.id}`;
        if(op.op==='put'){
          const blob=await Store.getBlob(op.id);
          if(blob){ const {error}=await this.sb.storage.from('photos').upload(path,blob,{upsert:true,contentType:blob.type||'image/webp'}); if(error) throw error }
        } else await this.sb.storage.from('photos').remove([path]);
      } else {
        let row;
        if(op.op==='put'){
          const local=await Store._get(op.coll,op.id);
          if(!local){ await Store._del('outbox',op.k); continue }
          row={id:op.id,data:local,deleted:false};
        } else row={id:op.id,data:{},deleted:true};
        const {error}=await this.sb.from(op.coll).upsert(row,{onConflict:'user_id,id'});
        if(error) throw error;
      }
      const cur=await Store._get('outbox',op.k);
      if(cur && cur.at===op.at) await Store._del('outbox',op.k);
    }
    Store.pending=(await Store._all('outbox')).length;
  },
  async pull(){
    let changed=false;
    for(const coll of COLLS){
      const lk=`atelier.pull.${Store.uid}.${coll}`;
      let since; try{ since=localStorage.getItem(lk) }catch(e){}
      since=since||'1970-01-01T00:00:00+00:00';
      let max=since, from=0;
      for(;;){
        const {data,error}=await this.sb.from(coll).select('id,data,deleted,updated_at').gt('updated_at',since).order('updated_at',{ascending:true}).range(from,from+499);
        if(error) throw error;
        for(const r of data){
          if(r.updated_at>max) max=r.updated_at;
          if(Store.hiding.has(r.id)) continue;   // being deleted, waiting for the undo window to close
          if(await Store._get('outbox',coll+':'+r.id)) continue;   // a local change is waiting to go up; it wins
          const map=Store[coll];
          if(r.deleted){ if(map.has(r.id)){ await Store._del(coll,r.id); map.delete(r.id); changed=true } continue }
          const loc=map.get(r.id);
          if(loc && (loc.updatedAt||0)>=(r.data?.updatedAt||0)) continue;
          const obj={...r.data,id:r.id};
          await Store._put(coll,obj); map.set(r.id,obj); changed=true;
        }
        if(data.length<500) break;
        from+=500;
      }
      try{ localStorage.setItem(lk,max) }catch(e){}
    }
    if(changed) Store.onChange();
  },
  async fetchPhoto(key){
    if(!this.sb||!Store.uid) return null;
    try{
      const {data,error}=await this.sb.storage.from('photos').download(`${Store.uid}/${key}`);
      if(error||!data) return null;
      await Store.putBlob(key,data);
      return data;
    }catch(e){ return null }
  },
};

function renderSyncNote(){
  const note=$('#mode-note'); if(!note) return;
  if(Store.mode==='memory'){ note.hidden=false; note.querySelector('span').textContent='This browser is blocking storage. Open the app from its Home Screen icon.'; return }
  if(Store.syncError && Store.pending){ note.hidden=false; note.querySelector('span').textContent=`${Store.syncError} · ${Store.pending} ${Store.pending===1?'change':'changes'} waiting`; return }
  note.hidden=true;
}

/* ---------- sign in ---------- */
const Auth = {
  mode:'signin',
  show(msg=''){
    const el=$('#auth'); el.hidden=false; $('.app').setAttribute('aria-hidden','true');
    this.paint(); $('#auth-msg').textContent=msg; $('#auth-msg').hidden=!msg;
    setTimeout(()=>$('#auth-email').focus(),50);
  },
  hide(){ $('#auth').hidden=true; $('.app').removeAttribute('aria-hidden') },
  paint(){
    const up=this.mode==='signup';
    $('#auth-title').textContent=up?'Create your account':'Welcome back';
    $('#auth-go').textContent=up?'Create account':'Sign in';
    $('#auth-pass').setAttribute('autocomplete',up?'new-password':'current-password');
    $('#auth-switch').innerHTML=up?'Already have an account? <b>Sign in</b>':'New here? <b>Create an account</b>';
    $('#auth-hint').hidden=!up;
  },
  error(e){
    const m=String(e?.message||e||'');
    if(/invalid login/i.test(m)) return 'That email and password don’t match. Check both and try again.';
    if(/already registered|already exists/i.test(m)) return 'There’s already an account with this email. Sign in instead.';
    if(/password.*(6|characters|short)/i.test(m)) return 'Choose a password with at least 6 characters.';
    if(/signups? (are )?(not allowed|disabled)/i.test(m)) return 'New accounts are closed. Ask whoever set up the app to open sign-ups.';
    if(/email.*(invalid|valid)/i.test(m)) return 'That email address doesn’t look right.';
    if(/not confirmed/i.test(m)) return 'This account is waiting for email confirmation, which is switched on in Supabase. Turn off “Confirm email” there, then try again.';
    if(/fetch|network/i.test(m)) return 'No connection. Connect to the internet to sign in the first time.';
    return 'Something went wrong: '+m;
  },
  async submit(e){
    e.preventDefault();
    const email=$('#auth-email').value.trim(), password=$('#auth-pass').value, btn=$('#auth-go'), msg=$('#auth-msg');
    if(!Sync.sb){ msg.hidden=false; msg.textContent='No connection. Connect to the internet to sign in the first time.'; return }
    btn.disabled=true; msg.hidden=true;
    try{
      const res=this.mode==='signup' ? await Sync.sb.auth.signUp({email,password}) : await Sync.sb.auth.signInWithPassword({email,password});
      if(res.error) throw res.error;
      if(!res.data.session){ throw new Error('Email not confirmed') }
      $('#auth-pass').value='';
      await enterApp(res.data.session.user,{skipLock:true});
    }catch(err){ msg.hidden=false; msg.textContent=this.error(err) }
    btn.disabled=false;
  },
};
async function enterApp(user,opts={}){
  try{ localStorage.setItem('atelier.lastUser',JSON.stringify({id:user.id,email:user.email})) }catch(e){}
  Store.urls.clear();
  await Store.start(user.id,user.email);
  Auth.hide(); render(); renderSyncNote();
  if(Lock.cred && !opts.skipLock) Lock.show(true);
  await offerDeviceImport();
  Sync.run();
}
/* Pieces added before sign-in lived in an on-device-only store; offer to bring them into the account once. */
async function offerDeviceImport(){
  try{
    if(localStorage.getItem('atelier.imported')) return;
    const old=await new Promise((res,rej)=>{const r=indexedDB.open('atelier'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)});
    if(!old.objectStoreNames.contains('items')){ old.close(); return }
    const all=s=>new Promise(res=>{ if(!old.objectStoreNames.contains(s)) return res([]); const q=old.transaction(s,'readonly').objectStore(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]) });
    const items=await all('items');
    if(!items.length){ old.close(); return }
    const ok=await confirmBox(`There ${items.length===1?'is 1 piece':`are ${items.length} pieces`} saved on this device from before you signed in. Add ${items.length===1?'it':'them'} to your account?`,'Add them');
    try{ localStorage.setItem('atelier.imported','1') }catch(e){}
    if(!ok){ old.close(); return }
    const t=toast('Adding pieces to your account…',0);
    const [outfits,days,blobs]=await Promise.all([all('outfits'),all('days'),all('blobs')]);
    for(const b of blobs){ const blob=b.blob||(b.buf&&new Blob([b.buf],{type:b.type})); if(blob){ await Store.putBlob(b.key,blob); await Store.enqueue('blobs',b.key,'put') } }
    for(const it of items){ await Store._save('items',it) }
    for(const o of outfits){ await Store._save('outfits',o) }
    for(const d of days){ await Store._save('days',d) }
    old.close(); t.remove(); toast(`${items.length} pieces added — syncing now`);
  }catch(e){}
}
async function signOut(){
  if(Store.pending && !await confirmBox(`${Store.pending} ${Store.pending===1?'change hasn’t':'changes haven’t'} synced yet. Sign out anyway? They stay on this device and sync next time you sign in here.`,'Sign out')) return;
  try{ localStorage.removeItem('atelier.lastUser') }catch(e){}
  try{ await Sync.sb?.auth.signOut() }catch(e){}
  location.reload();
}

/* ---------- Face ID / Touch ID lock (a passkey kept on this device) ---------- */
const b64u={
  enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((str.length+3)%4)); return Uint8Array.from(s,c=>c.charCodeAt(0))}
};
const Lock={
  ok:false, hiddenAt:0, busy:false,
  key(){return 'atelier.lock.'+Store.uid},
  get cred(){ try{ return Store.uid?localStorage.getItem(this.key()):null }catch(e){ return null } },
  async check(){ try{ this.ok=!!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) }catch(e){ this.ok=false } return this.ok },
  async enable(){
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:'VL Atelier',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:Store.email||'VL Atelier',displayName:Store.email||'VL Atelier'},
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000, attestation:'none'}});
    if(!cred) throw new Error('No credential');
    localStorage.setItem(this.key(), b64u.enc(cred.rawId));
  },
  disable(){ try{ localStorage.removeItem(this.key()) }catch(e){} },
  show(auto){
    $('#lock').hidden=false; $('.app').setAttribute('aria-hidden','true'); $('#lock-msg').hidden=true;
    if(auto) setTimeout(()=>this.unlock(true),250);
  },
  hide(){ $('#lock').hidden=true; $('.app').removeAttribute('aria-hidden') },
  async unlock(auto){
    const id=this.cred; if(!id){ this.hide(); return }
    if(this.busy) return; this.busy=true;
    try{
      const ok=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
        allowCredentials:[{type:'public-key',id:b64u.dec(id),transports:['internal']}],userVerification:'required',timeout:60000}});
      if(ok) this.hide();
    }catch(e){
      if(!auto){ $('#lock-msg').hidden=false; $('#lock-msg').textContent='Face ID didn’t unlock it. Try again, or use your password.' }
    }
    this.busy=false;
  },
  usePassword(){
    this.hide(); Auth.mode='signin'; Auth.show(); $('#auth-email').value=Store.email||''; setTimeout(()=>$('#auth-pass').focus(),60);
  },
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ Lock.hiddenAt=Date.now(); return }
  if(Lock.cred && Lock.hiddenAt && Date.now()-Lock.hiddenAt>60000 && $('#auth').hidden) Lock.show(true);
});

/* ---------- image tools ---------- */
async function fileToCanvas(file,max){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:'from-image'}) }
  catch(e){
    src = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That file could not be opened as a photo.'));i.src=URL.createObjectURL(file)});
  }
  const w0=src.width, h0=src.height, k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement('canvas'); c.width=Math.round(w0*k); c.height=Math.round(h0*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}
function scaleCanvas(src,max){
  const k=Math.min(1,max/Math.max(src.width,src.height));
  if(k===1) return src;
  const c=document.createElement('canvas'); c.width=Math.round(src.width*k); c.height=Math.round(src.height*k);
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(src,0,0,c.width,c.height); return c;
}
function canvasBlob(c,type,q){return new Promise(res=>c.toBlob(b=>res(b),type,q))}
async function exportCutout(c){
  const s=scaleCanvas(c,800);
  let b=await canvasBlob(s,'image/webp',.86);
  if(!b || b.type!=='image/webp') b=await canvasBlob(s,'image/png');
  return b;
}
/* Automatic background removal. The photo's border pixels are grouped into a few background colours
   (bed sheet, shadow, floor…), then a flood-fill from the edges clears pixels close to any of them.
   Stray specks are dropped and the edge is softened. Returns an uncropped canvas with transparency, or null. */
function removeBgRaw(src,strength){
  const w=src.width,h=src.height,g=src.getContext('2d');
  const img=g.getImageData(0,0,w,h), d=img.data, N=w*h;
  const samples=[]; const band=Math.max(2,Math.round(Math.min(w,h)*0.015));
  for(let b=0;b<band;b+=2){
    for(let x=0;x<w;x+=3){samples.push(b*w+x,(h-1-b)*w+x)}
    for(let y=0;y<h;y+=3){samples.push(y*w+b,y*w+w-1-b)}
  }
  const S=samples.map(p=>[d[p*4],d[p*4+1],d[p*4+2]]);
  S.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  const K=4; let C=[0,1,2,3].map(i=>S[Math.floor((i+.5)/K*S.length)].slice());
  for(let it=0;it<6;it++){
    const acc=C.map(()=>[0,0,0,0]);
    for(const s of S){let bi=0,bd=1e9;C.forEach((c,i)=>{const dd=(s[0]-c[0])**2+(s[1]-c[1])**2+(s[2]-c[2])**2;if(dd<bd){bd=dd;bi=i}});const a=acc[bi];a[0]+=s[0];a[1]+=s[1];a[2]+=s[2];a[3]++}
    C=C.map((c,i)=>acc[i][3]?[acc[i][0]/acc[i][3],acc[i][1]/acc[i][3],acc[i][2]/acc[i][3]]:c);
  }
  // ignore clusters that hardly appear on the border (likely the garment touching the edge)
  const cnt=C.map(()=>0); for(const s of S){let bi=0,bd=1e9;C.forEach((c,i)=>{const dd=(s[0]-c[0])**2+(s[1]-c[1])**2+(s[2]-c[2])**2;if(dd<bd){bd=dd;bi=i}});cnt[bi]++}
  const BG=C.filter((c,i)=>cnt[i]>S.length*0.08); if(!BG.length) BG.push(...C);
  const tol=10+strength*0.9, t2=tol*tol, near=(tol*0.45)**2, wide=(tol*1.7)**2;
  const dbg=p=>{const i=p*4;let m=1e9;for(const c of BG){const r=d[i]-c[0],gg=d[i+1]-c[1],b=d[i+2]-c[2],v=r*r+gg*gg+b*b;if(v<m)m=v}return m};
  const dpx=(p,o)=>{const i=p*4,j=o*4,r=d[i]-d[j],gg=d[i+1]-d[j+1],b=d[i+2]-d[j+2];return r*r+gg*gg+b*b};
  const mask=new Uint8Array(N), q=new Int32Array(N); let qh=0,qt=0;
  const seed=p=>{if(!mask[p]&&dbg(p)<wide){mask[p]=1;q[qt++]=p}};
  for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x)}
  for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1)}
  while(qh<qt){
    const p=q[qh++], x=p%w;
    const nb=[x>0?p-1:-1, x<w-1?p+1:-1, p-w, p+w];
    for(const o of nb){
      if(o<0||o>=N||mask[o]) continue;
      const db=dbg(o);
      if(db<t2 || (db<wide && dpx(o,p)<near)){mask[o]=1;q[qt++]=o}
    }
  }
  // keep the piece: drop small leftover islands (keeps both shoes of a pair, both earrings)
  const lab=new Int32Array(N); const sizes=[0]; let L=0;
  for(let s=0;s<N;s++){
    if(mask[s]||lab[s]) continue;
    L++; let n=0; qh=qt=0; q[qt++]=s; lab[s]=L;
    while(qh<qt){const p=q[qh++],x=p%w;n++;
      if(x>0&&!mask[p-1]&&!lab[p-1]){lab[p-1]=L;q[qt++]=p-1}
      if(x<w-1&&!mask[p+1]&&!lab[p+1]){lab[p+1]=L;q[qt++]=p+1}
      if(p>=w&&!mask[p-w]&&!lab[p-w]){lab[p-w]=L;q[qt++]=p-w}
      if(p+w<N&&!mask[p+w]&&!lab[p+w]){lab[p+w]=L;q[qt++]=p+w}}
    sizes.push(n);
  }
  const big=Math.max(...sizes), keep=Math.max(big*0.06,N*0.002);
  let fg=0;
  for(let p=0;p<N;p++){ if(!mask[p]){ if(sizes[lab[p]]<keep) mask[p]=1; else fg++ } }
  if(fg<N*0.03 || fg>N*0.97) return null;
  for(let p=0;p<N;p++){
    if(mask[p]){d[p*4+3]=0;continue}
    const x=p%w; let edge=0;
    if(x>0&&mask[p-1])edge++; if(x<w-1&&mask[p+1])edge++; if(p>=w&&mask[p-w])edge++; if(p+w<N&&mask[p+w])edge++;
    if(edge) d[p*4+3]=edge>2?90:170;
  }
  const out=document.createElement('canvas'); out.width=w; out.height=h; out.getContext('2d').putImageData(img,0,0);
  return out;
}
function removeBackground(src,strength){ const r=removeBgRaw(src,strength); return r?cropToAlpha(r):null }
/* Cut along a hand-drawn outline; optionally also clear background left inside the line. */
function normRect(r){return [Math.min(r[0],r[2]),Math.min(r[1],r[3]),Math.max(r[0],r[2]),Math.max(r[1],r[3])]}
function cropExact(c,x0,y0,x1,y1){
  const o=document.createElement('canvas'); o.width=Math.max(1,x1-x0); o.height=Math.max(1,y1-y0);
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height); return o;
}
function lassoCut(base,pts,raw){
  const c=document.createElement('canvas'); c.width=base.width; c.height=base.height; const g=c.getContext('2d');
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(const p of pts) g.lineTo(p[0],p[1]); g.closePath();
  g.fillStyle='#000'; g.fill();
  g.globalCompositeOperation='source-in'; g.drawImage(base,0,0);
  if(raw){ g.globalCompositeOperation='destination-in'; g.drawImage(raw,0,0) }
  return cropToAlpha(c);
}
function cropCanvas(c,x0,y0,x1,y1){
  const pad=Math.round(Math.max(x1-x0,y1-y0)*0.04);
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(c.width-1,x1+pad); y1=Math.min(c.height-1,y1+pad);
  const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1;
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height); return o;
}
function cropToAlpha(c){
  const g=c.getContext('2d'),{width:w,height:h}=c,d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return x1>x0?cropCanvas(c,x0,y0,x1,y1):c;

const layer=$('#layer');
let toastTimer;
function toast(msg,ms=2600){
  $('.toast')?.remove(); clearTimeout(toastTimer);
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); if(ms) toastTimer=setTimeout(()=>t.remove(),ms); return t;
}
function confirmBox(text,ok='Delete'){
  return new Promise(res=>{
    const el=document.createElement('div'); el.className='confirm';
    el.innerHTML=`<div class="confirm-box" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row"><button class="btn ghost" data-a="no" style="flex:1">Cancel</button><button class="btn primary" data-a="yes" style="flex:1">${esc(ok)}</button></div></div>`;
    el.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a; if(a||e.target===el){el.remove();res(a==='yes')}});
    document.body.appendChild(el); el.querySelector('[data-a="yes"]').focus();
  });
}
function openSheet(title,body,foot,onClose){
  closeSheet();
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</div>`;
  wrap._onClose=onClose;
  wrap.querySelector('.scrim').onclick=closeSheet; wrap.querySelector('[data-close]').onclick=closeSheet;
  layer.appendChild(wrap); return wrap.querySelector('.sheet');
}
function closeSheet(){ const w=layer.firstElementChild; if(w){w._onClose?.(); w.remove()} }
function chipBtns(list,selected,attr){return list.map(([id,l])=>`<button type="button" class="chip" data-${attr}="${id}" aria-pressed="${selected.includes(id)}">${esc(l)}</button>`).join('')}
function swatchBtns(selected,attr){return COLOURS.map(([id,l,hex])=>`<button type="button" class="sw${hex?'':' multi'}" data-${attr}="${id}" aria-pressed="${selected.includes(id)}" aria-label="${esc(l)}" title="${esc(l)}" ${hex?`style="background:${hex}"`:''}></button>`).join('')}
function toggleOnClick(root,sel){root.addEventListener('click',e=>{const b=e.target.closest(sel);if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')})}
const pressed=(root,attr)=>$$(`[data-${attr}][aria-pressed="true"]`,root).map(b=>b.dataset[attr]);

/* ---------- wardrobe view ---------- */
function renderWardrobe(){
  const everything=Store.list(), wishN=everything.filter(isWish).length, ownedN=everything.length-wishN;
  const all=everything.filter(i=>S.list==='wish'?isWish(i):!isWish(i));
  const counts={}; all.forEach(i=>{counts[i.cat||'']=(counts[i.cat||'']||0)+1});
  const favN=all.filter(i=>i.fav).length;
  $('#tagline').textContent = `Wardrobe · ${ownedN} ${ownedN===1?'piece':'pieces'}${wishN?` · ${wishN} on the wish list`:''}`;
  $('#list-seg').innerHTML=`<button type="button" data-list="owned" aria-pressed="${S.list==='owned'}">Wardrobe<span class="n">${ownedN}</span></button><button type="button" data-list="wish" aria-pressed="${S.list==='wish'}">Wish list<span class="n">${wishN}</span></button>`;

  let chips=`<button class="chip" data-cat="all" aria-pressed="${S.cat==='all'}">All <span class="n">${all.length}</span></button>`;
  if(counts['']) chips+=`<button class="chip flag" data-cat="" aria-pressed="${S.cat===''}">To tag <span class="n">${counts['']}</span></button>`;
  if(favN) chips+=`<button class="chip" data-cat="fav" aria-pressed="${S.cat==='fav'}">♥ Favourites <span class="n">${favN}</span></button>`;
  const logged=[...Store.days.keys()].some(k=>k<=todayKey()), staleN=logged&&S.list==='owned'?all.filter(i=>i.cat&&isStale(i)).length:0;
  if(staleN) chips+=`<button class="chip" data-cat="stale" aria-pressed="${S.cat==='stale'}">Not worn lately <span class="n">${staleN}</span></button>`;
  chips+=CATS.map(c=>`<button class="chip${counts[c.id]?'':' dim'}" data-cat="${c.id}" aria-pressed="${S.cat===c.id}">${c.label} <span class="n">${counts[c.id]||0}</span></button>`).join('');
  $('#cat-chips').innerHTML=chips;

  const cat=catById(S.cat), subEl=$('#sub-chips');
  if(cat){
    const sc={}; all.filter(i=>i.cat===cat.id).forEach(i=>{if(i.sub)sc[i.sub]=(sc[i.sub]||0)+1});
    subEl.innerHTML=`<button class="chip" data-sub="" aria-pressed="${!S.sub}">All ${cat.label.toLowerCase()}</button>`+
      cat.subs.map(s=>`<button class="chip${sc[s]?'':' dim'}" data-sub="${esc(s)}" aria-pressed="${S.sub===s}">${esc(s)} <span class="n">${sc[s]||0}</span></button>`).join('');
    subEl.hidden=false;
  } else subEl.hidden=true;

  const q=S.q.trim().toLowerCase();
  const list=all.filter(i=>{
    if(S.cat==='fav'){ if(!i.fav) return false }
    else if(S.cat==='stale'){ if(!i.cat||!isStale(i)) return false }
    else if(S.cat!=='all' && (i.cat||'')!==S.cat) return false;
    if(cat && S.sub && i.sub!==S.sub) return false;
    if(S.colours.size && !(i.colours||[]).some(c=>S.colours.has(c))) return false;
    if(S.seasons.size && !(i.seasons||[]).some(c=>S.seasons.has(c))) return false;
    if(S.occasions.size && !(i.occasions||[]).some(c=>S.occasions.has(c))) return false;
    if(q){const hay=[i.name,i.brand,i.shop,i.notes,i.sub,catById(i.cat)?.label,...(i.colours||[]).map(colourName)].join(' ').toLowerCase(); if(!hay.includes(q)) return false}
    return true;
  });
  const wc=i=>S.wear.get(i.id)?.count||0, ci=i=>{const c=(i.colours||[])[0]; const k=COLOURS.findIndex(x=>x[0]===c); return k<0?99:k};
  if(S.sort==='worn') list.sort((a,b)=>wc(b)-wc(a));
  else if(S.sort==='least') list.sort((a,b)=>wc(a)-wc(b));
  else if(S.sort==='colour') list.sort((a,b)=>ci(a)-ci(b));
  else if(S.sort==='name') list.sort((a,b)=>itemLabel(a).localeCompare(itemLabel(b)));
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layout===S.layout));

  const body=$('#wardrobe-body');
  if(!all.length && S.list==='wish'){
    body.innerHTML=`<div class="empty">
      <h2>Nothing on the wish list yet</h2>
      <p>Spotted something on a shop’s website? Take a screenshot, add it here and crop it down to the piece. Try it in outfits before buying.</p>
      <div class="stack">${Store.canWrite?`<button class="btn primary" data-act="wish">Add a screenshot</button>`:''}</div></div>`;
    return;
  }
  if(!all.length){
    body.innerHTML=`<div class="empty">
      <h2>Your wardrobe starts with one piece</h2>
      <p>Lay a piece flat on a plain bed or floor and take a photo from above. The background is cleaned away automatically.</p>
      <div class="stack">
        ${Store.canWrite?`<button class="btn primary" data-act="camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo</button>
        <button class="btn" data-act="library">Add several from photos</button>
        <button class="btn ghost" data-act="examples">Try it with 8 example pieces</button>`:`<p class="note">This copy is view-only. Ask the owner for edit access to add pieces.</p>`}
      </div></div>`;
    return;
  }
  if(!list.length){
    body.innerHTML=`<div class="empty"><h2>Nothing matches</h2><p>No pieces fit these filters yet.</p><div><button class="btn" data-act="clear">Show everything</button></div></div>`;
    return;
  }
  if(S.layout==='cats' && S.cat==='all' && !q && !(S.colours.size+S.seasons.size+S.occasions.size)){
    const rows=CATS.map(c=>{const its=all.filter(i=>i.cat===c.id); const subs=c.subs.map(sb=>[sb,its.filter(i=>i.sub===sb).length]).filter(x=>x[1]);
      return `<button type="button" class="catrow${its.length?'':' dim'}" data-cat="${c.id}"><span class="cthumb"><img src="${catIcon(c.id)}" alt=""></span>
        <span class="ctext"><b>${esc(c.label)}</b><small>${its.length} ${its.length===1?'item':'items'}${subs.length?' · '+esc(subs.map(x=>`${x[0]} ${x[1]}`).join(', ')):''}</small></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg></button>`}).join('');
    body.innerHTML=`<div class="catlist">${counts['']?`<button type="button" class="catrow" data-cat=""><span class="cthumb"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" style="width:22px;height:22px"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg></span><span class="ctext"><b>To tag</b><small>${counts['']} waiting for a category</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg></button>`:''}${rows}</div>`;
    return;
  }
  S.visibleIds=list.map(i=>i.id);
  const selN=S.selected.size;
  const bar=Store.canWrite?(S.selecting
    ?`<div class="gridbar sel"><div class="selrow"><button type="button" class="link" data-act="sel-cancel">Cancel</button><span>${selN?`${selN} selected`:'Tap pieces to select them'}</span><button type="button" class="link" data-act="sel-all">${selN&&selN===list.length?'Select none':'Select all'}</button></div>
        <div class="selacts"><button type="button" class="btn" data-act="sel-tag" ${selN?'':'disabled'}>Tag</button><button type="button" class="btn danger" data-act="sel-delete" ${selN?'':'disabled'}>Delete</button></div></div>`
    :`<div class="gridbar"><span>${list.length} ${list.length===1?'piece':'pieces'}${S.cat===''&&list.length>1?' · select several to tag them at once':''}</span><button type="button" class="link" data-act="sel-start">Select</button></div>`):'';
  body.innerHTML=bar+`<div class="grid${S.layout==='grid3'?' dense':''}${S.selecting?' selecting':''}">${list.map(i=>`<button class="card${S.selected.has(i.id)?' picked':''}" data-item="${i.id}" ${S.selecting?`aria-pressed="${S.selected.has(i.id)}"`:''}>
      <div class="pic">${i.img?`<img src="${esc(Store.imgUrl(i.img))}" alt="" loading="lazy" decoding="async">`:''}
        ${!i.cat?'<span class="badge todo">To tag</span>':i.example?'<span class="badge">Example</span>':''}${i.fav?'<span class="fav">♥</span>':''}${S.selecting?'<span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 12 4 4 8-8"/></svg></span>':''}</div>
      <div class="tag"><b>${esc(itemLabel(i))}</b><span>${esc(isWish(i)?[i.price,i.shop].filter(Boolean).join(' · '):[i.brand,i.cat?(i.sub||catById(i.cat)?.label):'Needs a category'].filter(Boolean).join(' · '))}</span></div>
    </button>`).join('')}</div>`;
}

function wireForm(sheet,it){
  let cat=it.cat||'', sub=it.sub||'';
  const cats=$('#f-cats',sheet), subs=$('#f-subs',sheet), wrap=$('#f-sub-wrap',sheet);
  const paint=()=>{
    $$('[data-fcat]',cats).forEach(b=>b.setAttribute('aria-pressed',b.dataset.fcat===cat));
    const c=catById(cat); wrap.hidden=!c;
    subs.innerHTML=c?c.subs.map(s=>`<button type="button" class="chip" data-fsub="${esc(s)}" aria-pressed="${s===sub}">${esc(s)}</button>`).join(''):'';
  };
  cats.onclick=e=>{const b=e.target.closest('[data-fcat]'); if(!b) return; cat=cat===b.dataset.fcat?'':b.dataset.fcat; sub=''; paint()};
  subs.onclick=e=>{const b=e.target.closest('[data-fsub]'); if(!b) return; sub=sub===b.dataset.fsub?'':b.dataset.fsub; paint()};
  let st=isWish(it)?'wish':'owned';
  const stEl=$('#f-status',sheet);
  stEl.onclick=e=>{const b=e.target.closest('[data-st]'); if(!b) return; st=b.dataset.st;
    $$('[data-st]',stEl).forEach(x=>x.setAttribute('aria-pressed',x.dataset.st===st));
    $('#f-link-wrap',sheet).hidden=st!=='wish'; $('label[for="f-price"]',sheet).textContent=st==='wish'?'Price':'Price paid'};
  sheet._form={get cat(){return cat}, get sub(){return sub}, get status(){return st}, set(c,s){cat=c;sub=s||'';paint()}};
  paint();
  toggleOnClick($('#f-colours',sheet),'[data-c]'); toggleOnClick($('#f-seasons',sheet),'[data-s]'); toggleOnClick($('#f-occasions',sheet),'[data-o]');
}
function readForm(sheet){
  return {name:$('#f-name',sheet).value.trim(), cat:sheet._form.cat, sub:sheet._form.sub,

    status:sheet._form.status==='wish'?'wish':'', price:$('#f-price',sheet).value.trim(), shop:$('#f-shop',sheet).value.trim(), link:$('#f-link',sheet).value.trim()};
}
function applyToForm(sheet,t){

}

  const back=$('#add-back',sheet), next=$('#add-next',sheet), title=$('.sheet-head h3',sheet), body=$('.sheet-body',sheet);
  Add.mode=edit?(opts.adjust?'none':(pref.cleanup==='none'?'none':'auto')):wish?'crop':(pref.cleanup==='none'?'none':'auto'); Add.pts=[]; Add.rect=null; Add.done={draw:false,crop:false}; Add.step=1; Add.status=wish?'wish':'';
  try{ Add.base=await fileToCanvas(file,wish?1400:1000) }catch(e){ toast(e.message||'That photo could not be opened.'); closeSheet(); return }
  if(!sheet.isConnected) return;

  const accent=()=>getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#8C3A5D';
  const showDraw=(m)=>{
    stage.classList.add('drawing');
    stage.innerHTML=`<canvas id="draw-cv" aria-label="${m==='crop'?'Photo — drag a box around the piece':'Photo — trace around the piece'}"></canvas>`;
    const cv=$('#draw-cv',sheet); cv.width=Add.base.width; cv.height=Add.base.height;
    const g=cv.getContext('2d'), lw0=Math.max(3,cv.width/140); let lw=lw0;
    const paint=()=>{
      lw=lw0/(Add.view?.s||1);
      g.globalCompositeOperation='source-over'; g.drawImage(Add.base,0,0);
      if(m==='crop'){
        if(!Add.rect) return;
        const [x0,y0,x1,y1]=normRect(Add.rect);
        g.fillStyle='rgba(0,0,0,.45)';
        g.fillRect(0,0,cv.width,y0); g.fillRect(0,y1,cv.width,cv.height-y1); g.fillRect(0,y0,x0,y1-y0); g.fillRect(x1,y0,cv.width-x1,y1-y0);
        g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=lw+3; g.strokeRect(x0,y0,x1-x0,y1-y0);
        g.strokeStyle=accent(); g.lineWidth=lw; g.strokeRect(x0,y0,x1-x0,y1-y0);
        return;
      }
      if(Add.pts.length>1){
        g.beginPath(); g.moveTo(Add.pts[0][0],Add.pts[0][1]); for(const p of Add.pts) g.lineTo(p[0],p[1]);
        g.lineJoin='round'; g.lineCap='round';
        g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=lw+4; g.stroke();
        g.strokeStyle=accent(); g.lineWidth=lw; g.stroke();
      }
    };
    paint();
    const pos=e=>{const r=cv.getBoundingClientRect(); return [clamp((e.clientX-r.left)/r.width*cv.width,0,cv.width),clamp((e.clientY-r.top)/r.height*cv.height,0,cv.height)]};
    /* zoom & pan: two fingers pinch/move the photo, one finger draws */
    const V=Add.view={s:1,tx:0,ty:0};
    cv.style.transformOrigin='0 0';
    const zl=$('#zoom-l',sheet);
    const bound=()=>{ const w=cv.offsetWidth,h=cv.offsetHeight; if(V.s<=1.001){V.s=1;V.tx=0;V.ty=0;return}
      V.tx=clamp(V.tx,w-w*V.s,0); V.ty=clamp(V.ty,h-h*V.s,0) };
    const apply=()=>{ bound(); cv.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.s})`; if(zl) zl.textContent=Math.round(V.s*100)+'%'; paint() };
    const zoomBy=(f)=>{ const w=cv.offsetWidth,h=cv.offsetHeight, cx=w/2, cy=h/2, q={x:(cx-V.tx)/V.s,y:(cy-V.ty)/V.s};
      V.s=clamp(V.s*f,1,8); V.tx=cx-V.s*q.x; V.ty=cy-V.s*q.y; apply() };
    Add.zoom=zoomBy; Add.fit=()=>{V.s=1;apply()};
    const basePos=()=>({x:cv.offsetLeft,y:cv.offsetTop});
    const sp=e=>{const r=stage.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}};
    const pts=new Map(); let gesture=null, pinch=null, before=null;
    apply();
    stage.onpointerdown=e=>{
      if(!sheet.isConnected) return;
      pts.set(e.pointerId,sp(e)); try{stage.setPointerCapture(e.pointerId)}catch(_){}
      e.preventDefault();
      if(pts.size>=2){
        if(gesture==='draw'){ Add.pts=before.pts; Add.rect=before.rect; paint() }   // second finger: it was a pinch, not a stroke
        const [a,b]=[...pts.values()], mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}, B=basePos();
        pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:V.s, q:{x:(mid.x-B.x-V.tx)/V.s, y:(mid.y-B.y-V.ty)/V.s}};
        gesture='pinch'; return;
      }
      if(gesture==='pinch') return;
      before={pts:Add.pts, rect:Add.rect};
      gesture='draw'; const p=pos(e);
      if(m==='crop') Add.rect=[p[0],p[1],p[0],p[1]]; else Add.pts=[p];
      paint();
    };
    stage.onpointermove=e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,sp(e));
      if(gesture==='pinch'){
        if(pts.size<2) return;
        const [a,b]=[...pts.values()], mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}, B=basePos();
        V.s=clamp(pinch.s0*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,1,8);
        V.tx=mid.x-B.x-V.s*pinch.q.x; V.ty=mid.y-B.y-V.s*pinch.q.y; apply(); return;
      }
      if(gesture!=='draw') return;
      const p=pos(e);
      if(m==='crop'){ Add.rect[2]=p[0]; Add.rect[3]=p[1]; paint(); return }
      const l=Add.pts[Add.pts.length-1];
      if(Math.hypot(p[0]-l[0],p[1]-l[1])>cv.width/(250*V.s)){Add.pts.push(p); paint()}
    };
    const up=e=>{
      pts.delete(e.pointerId);
      if(gesture==='pinch'){ if(!pts.size) gesture=null; return }    // lifting one finger after a pinch never starts a stroke
      if(gesture!=='draw') return; gesture=null;
      if(m==='crop'){
        const [x0,y0,x1,y1]=normRect(Add.rect);
        if(x1-x0<cv.width*.03||y1-y0<cv.height*.02){ Add.rect=before.rect||null; paint(); hint('Drag from one corner of the piece to the opposite corner. Pinch with two fingers to zoom.'); return }
        Add.done.crop=true; run(); return;
      }
      if(Add.pts.length<12){ Add.pts=[]; paint(); hint('Keep your finger down and trace all the way round the piece. Pinch with two fingers to zoom.'); return }
      Add.done.draw=true; run();
    };
    stage.onpointerup=up; stage.onpointercancel=up;
  };

  const run=async()=>{
    if(!Add.base||!sheet.isConnected) return;
    const m=Add.mode, refine=$('#add-refine',sheet).checked, tol=+$('#add-tol',sheet).value;
    $$('[data-m]',sheet).forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
    const shaped=m==='draw'||m==='crop', ready=shaped&&Add.done[m];
    $('#draw-row',sheet).hidden=!ready;
    $('#zoom-row',sheet).hidden=!(shaped&&!ready);
    if(!(shaped&&!ready)){ stage.onpointerdown=stage.onpointermove=stage.onpointerup=stage.onpointercancel=null }
    $('#add-refine-l',sheet).textContent=m==='crop'?'Also clear the background':'Also clear background inside the line';
    $('#tol-row',sheet).hidden=!(m==='auto'||(ready&&refine));
    if(shaped&&!ready){ next.disabled=true; showDraw(m); hint(m==='crop'?'Drag a box around the piece with one finger. Pinch with two fingers to zoom.':'Trace around the piece with one finger, then lift it. Pinch with two fingers to zoom.'); return }
    stage.classList.remove('drawing');
    let out=Add.base;
    if(m==='auto'){
      const r=removeBgRaw(Add.base,tol);
      if(r){ out=cropToAlpha(r); hint('Not quite right? Move the slider, or tap Draw around.') }
      else hint('The background couldn’t be separated automatically. Tap Draw around to outline the piece.');
    }
    if(m==='draw'){ out=lassoCut(Add.base,Add.pts,refine?removeBgRaw(Add.base,tol):null); hint('Happy with it? Tap Next. Otherwise redo the outline.') }
    if(m==='crop'){
      const [x0,y0,x1,y1]=normRect(Add.rect).map(Math.round);
      out=cropExact(Add.base,x0,y0,x1,y1);
      if(refine){ const r=removeBgRaw(out,tol); if(r){ out=cropToAlpha(r); hint('Happy with it? Tap Next. Or redo the box.') } else hint('The background couldn’t be cleared here, so the crop is kept as it is.') }
      else hint('Happy with it? Tap Next. Or redo the box.');
    }
    if(m==='none') hint('No clean-up: the photo is kept exactly as taken.');
    Add.out=out;
    const b=await canvasBlob(scaleCanvas(out,700),'image/png'); if(Add.url) URL.revokeObjectURL(Add.url); Add.url=URL.createObjectURL(b);
    stage.innerHTML=`<img src="${Add.url}" alt="Preview of the piece">`;
    next.disabled=false;
  };

  const goStep=n=>{
    Add.step=n;
    $('#step1',sheet).hidden=n!==1; $('#step2',sheet).hidden=n!==2;
    title.textContent=n===1?'New piece':'Details';
    back.textContent=n===1?'Cancel':'Back';
    next.textContent=n===1?'Next: details':'Save piece';
    body.scrollTop=0;
    if(n===2){
      const s2=$('#step2',sheet);
      if(!s2.dataset.ready){
        s2.innerHTML=`<div class="steps">Step 2 of 2 · Describe it</div>${formHTML({status:Add.status},Add.url,S.sampleImages)}`;
        wireForm(sheet,{status:Add.status}); s2.dataset.ready='1';
        $('#add-suggest',sheet)?.addEventListener('click',()=>suggestTags(sheet,()=>canvasBlob(scaleCanvas(Add.base,900),'image/jpeg',.85)));
      } else $('#f-thumb',sheet).src=Add.url;
    }
  };

  $('#zoom-row',sheet).onclick=e=>{const z=e.target.closest('[data-zoom]')?.dataset.zoom; if(!z) return; if(z==='fit') Add.fit?.(); else Add.zoom?.(z==='in'?1.5:1/1.5)};
  $('#add-mode',sheet).onclick=e=>{const b=e.target.closest('[data-m]'); if(!b) return; Add.mode=b.dataset.m; run()};
  $('#add-tol',sheet).oninput=()=>{clearTimeout(Add.timer);Add.timer=setTimeout(run,180)};
  $('#add-refine',sheet).onchange=run;
  $('#add-redraw',sheet).onclick=()=>{ if(Add.mode==='crop') Add.rect=null; else Add.pts=[]; Add.done[Add.mode]=false; run() };
  back.onclick=()=>{ if(Add.step===2) goStep(1); else closeSheet() };
  if(edit){ next.textContent='Use this photo'; $('.steps',sheet).textContent=opts.adjust?'Adjust the photo':'Clean up the new photo' }
  if(edit) back.onclick=()=>{ closeSheet(); const cur=Store.items.get(edit.id); if(cur) openEdit(cur) };
  next.onclick=async()=>{
    if(edit){
      next.disabled=true; next.textContent='Saving…';
      try{
        const cur=Store.items.get(edit.id)||edit, old=cur.img;
        const ref=await Store.addImage(await exportCutout(Add.out||Add.base));
        await Store.putItem({...cur,img:ref});
        if(old && old!==ref) await Store.dropImage(old);
        closeSheet(); toast('Photo updated'); openEdit(Store.items.get(edit.id));
      }catch(err){ next.disabled=false; next.textContent='Use this photo'; toast(saveError(err)) }
      return;
    }
    if(Add.step===1){ goStep(2); return }
    next.disabled=true; next.textContent='Saving…';
    try{
      const ref=await Store.addImage(await exportCutout(Add.out||Add.base));
      await Store.putItem({id:uid(),...readForm(sheet),img:ref,createdAt:Date.now()});
      closeSheet(); toast('Piece added');
    }catch(err){ next.disabled=false; next.textContent='Save piece'; toast(saveError(err)) }
  };
  run();
}
function saveError(err){
  const c=err?.code;
  if(c==='quota_exceeded') return 'Storage is full. Remove some pieces, then try again.';
  if(c==='not_granted'||c==='not_writer'||c==='permission_denied') return 'This copy is view-only, so the piece was not saved.';
  const why=[err?.name,err?.message].filter(Boolean).join(': ');
  return 'The piece was not saved.'+(why?' ('+why.slice(0,120)+')':' Try again.');
}
async function suggestTags(sheet,getBlob){
  const btn=$('#add-suggest',sheet); if(!btn) return;
  btn.disabled=true; btn.textContent='Looking at the photo…';
  const catList=CATS.map(c=>`${c.id}: ${c.subs.join(' | ')}`).join('\n');
  const prompt=`The image is a photo of one clothing item or accessory from a woman's wardrobe, usually laid flat. Identify it.
Reply with JSON only, shaped exactly like:
{"name":"2-4 word descriptive name, e.g. Striped Breton tee","category":"<category id>","subcategory":"<one subcategory from that category, copied exactly>","colours":["up to 3 colour ids"],"seasons":["season ids it suits"],"occasions":["occasion ids it suits"]}
Category ids and their subcategories:
${catList}
Colour ids: ${COLOURS.map(c=>c[0]).join(', ')}
Season ids: ${SEASONS.map(s=>s[0]).join(', ')}
Occasion ids: ${OCCASIONS.map(o=>o[0]).join(', ')}`;
  try{
    const blob=await getBlob();
    const t=await S.sample.json(prompt,{images:blob,modelTier:'quick'});
    if(t && typeof t==='object'){ applyToForm(sheet,t); btn.textContent='Tags suggested — check and adjust' }

  }catch(e){
    btn.textContent = e?.code==='not_granted'?'Suggestions are turned off for this page':e?.code==='rate_limited'?'Too many requests — try again in a minute':'Suggestion failed — fill it in by hand';
  }
}

async function addBatch(files,status){
  const wish=status==='wish', clean=!wish&&pref.cleanup!=='none';
  const n=files.length; let done=0, failed=0;
  const t=toast(`Adding 1 of ${n}…`,0);
  for(const f of files){
    try{
      const base=await fileToCanvas(f,wish?1400:1000);
      const out=clean?(removeBackground(base,40)||base):base;
      const ref=await Store.addImage(await exportCutout(out));
      await Store.putItem({id:uid(),name:'',cat:'',sub:'',colours:[],seasons:[],occasions:[],status:wish?'wish':'',img:ref,createdAt:Date.now()+done});
    }catch(e){failed++}
    done++; t.textContent=`Adding ${Math.min(done+1,n)} of ${n}…`;
  }
  t.remove();
  S.view='wardrobe'; S.list=wish?'wish':'owned'; S.cat=''; S.sub=null; render();
  toast(failed?`${n-failed} added, ${failed} could not be read`:`${n} pieces added — tap each to tag it`,3600);
}

/* Delete straight away, with a few seconds to undo. The real delete happens when the undo window closes. */
const Undo={pending:null};
async function commitPending(){
  const p=Undo.pending; if(!p) return;
  Undo.pending=null; clearTimeout(p.timer); p.el?.remove();
  try{ await p.commit() }catch(e){ toast('Some items could not be deleted. Try again.') }
  p.objs.forEach(o=>Store.hiding.delete(o.id));
}
function softDelete(coll,objs,label){
  commitPending();
  objs.forEach(o=>{ Store[coll].delete(o.id); Store.hiding.add(o.id) });
  render(); if(Builder.open) Builder.renderTray();
  $('.toast')?.remove(); clearTimeout(toastTimer);
  const el=document.createElement('div'); el.className='toast undo'; el.setAttribute('role','status');
  el.innerHTML=`<span>${esc(label)}</span><button type="button">Undo</button>`;
  document.body.appendChild(el);
  const p={objs,el,commit:async()=>{
    for(const o of objs){
      Store[coll].set(o.id,o);
      if(coll==='items') await Store.delItem(o.id); else if(coll==='outfits') await Store.delOutfit(o.id); else await Store.delDay(o.id);
    }
  }};
  p.timer=setTimeout(commitPending,7000);
  el.querySelector('button').onclick=()=>{
    if(Undo.pending!==p) return;
    clearTimeout(p.timer); Undo.pending=null; el.remove();
    objs.forEach(o=>{ Store[coll].set(o.id,o); Store.hiding.delete(o.id) });
    render(); toast('Restored');
  };
  Undo.pending=p;
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) commitPending() });

  const sheet=openSheet(itemLabel(it),`
