/* ---------- outfit builder ---------- */
const SLOTS = {tops:{x:.08,y:.05,w:.44},bottoms:{x:.12,y:.4,w:.36},dresses:{x:.08,y:.05,w:.44},outerwear:{x:.5,y:.03,w:.46},
  shoes:{x:.5,y:.72,w:.3},bags:{x:.58,y:.42,w:.34},jewellery:{x:.74,y:.06,w:.16},accessories:{x:.06,y:.76,w:.24},
  swim:{x:.12,y:.1,w:.42},active:{x:.1,y:.08,w:.42},lounge:{x:.1,y:.08,w:.44}};
const Builder = {
  open:false, id:null, name:'', occasion:'', bg:'', bgOpen:false, pieces:[], sel:-1, trayCat:'all', dragging:false, el:null,
  start(outfit,itemIds){
    this.open=true; this.id=outfit?.id||null; this.name=outfit?.name||''; this.occasion=outfit?.occasion||''; this.bg=okBg(outfit?.bg); this.bgOpen=false;
    this.pieces=outfit?outfit.pieces.filter(p=>Store.items.has(p.item)).map(p=>({...p})):[]; this.sel=-1;
    (itemIds||[]).forEach(id=>this.addPiece(id,true));
    const el=document.createElement('div'); el.className='builder';
    el.innerHTML=`<div class="builder-inner">
      <div class="bhead">
        <button class="icon-btn" id="b-close" aria-label="Close without saving"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <label class="visually-hidden" for="b-name">Outfit name</label>
        <input id="b-name" placeholder="Name this outfit" value="${esc(this.name)}" autocomplete="off">
        <button class="btn primary" id="b-save" style="height:40px">Save</button>
      </div>
      <div class="bstage"><div class="board" id="b-board"></div></div>
      <div class="btools" id="b-tools"></div>
      <div class="tray"><div class="chips" id="b-cats"></div><div class="tray-items" id="b-items"></div></div>
    </div>`;
    document.body.appendChild(el); this.el=el;
    $('#b-close').onclick=()=>this.close();
    $('#b-save').onclick=()=>this.save();
    $('#b-name').oninput=e=>this.name=e.target.value;
    $('#b-cats').onclick=e=>{const b=e.target.closest('[data-tc]'); if(b){this.trayCat=b.dataset.tc; this.renderTray()}};
    $('#b-items').onclick=e=>{const b=e.target.closest('[data-add]'); if(b){this.addPiece(b.dataset.add); this.renderBoard()}};
    $('#b-tools').onclick=e=>{
      const c=e.target.closest('[data-bgc]'); if(c){ this.bg=okBg(c.dataset.bgc); this.renderBoard(); return }
      this.tool(e.target.closest('[data-t]')?.dataset.t);
    };
    $('#b-tools').oninput=e=>{
      if(e.target.id==='b-bgc'){ this.bg=okBg(e.target.value); $('#b-board').style.background=this.bg; $$('[data-bgc]',this.el).forEach(x=>x.setAttribute('aria-pressed','false')); return }
      if(e.target.id==='b-size'){ const p=this.pieces[this.sel]; if(!p) return; p.w=clamp(+e.target.value/100,.06,1);
        const el=$(`#b-board .piece[data-i="${this.sel}"]`); if(el) el.style.width=p.w*100+'%' }
    };
    this.wirePointers(); this.renderBoard(); this.renderTray();
  },
  close(){ this.open=false; this.el?.remove(); this.el=null },
  addPiece(id,quiet){
    const it=Store.items.get(id); if(!it) return;
    const w=DEFAULT_W[it.cat||'']||.34, n=this.pieces.length;
    this.pieces.push({item:id,x:clamp(.5-w/2+((n%3)-1)*.08,0,1-w),y:clamp(.18+((n%4))*.06,0,.7),w});
    this.sel=this.pieces.length-1;
    if(!quiet) this.renderBoard();
  },
  renderBoard(){
    const b=$('#b-board'); if(!b) return;
    b.innerHTML=boardHTML(this.pieces,this.sel) || '';
    b.style.background=this.bg||'';
    if(!this.pieces.length) b.insertAdjacentHTML('beforeend','<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px">Tap pieces in the tray below to place them here</div>');
    this.renderTools();
  },
  renderTools(){
    const t=$('#b-tools'); if(!t) return;
    if(this.sel<0||!this.pieces[this.sel]){
      if(this.bgOpen){
        t.innerHTML=`<div class="bgrow">${BOARD_BG.map(([v,l])=>`<button type="button" class="sw" data-bgc="${v}" aria-pressed="${this.bg===v}" aria-label="${l} background" title="${l}" style="background:${v||'var(--tile)'}"></button>`).join('')}
          <label class="sw custom" title="Any colour"><span class="visually-hidden">Choose any colour</span><input type="color" id="b-bgc" value="${this.bg||'#E2DFE7'}"></label>
          <button class="btn ghost" data-t="bgdone" style="margin-left:auto">Done</button></div>`;
        return;
      }
      t.innerHTML=`<button class="btn" data-t="bg">Background</button>${this.pieces.length>1?'<button class="btn" data-t="tidy">Tidy up</button>':''}<span class="hint">Tap a piece to move or resize it</span><button class="btn" data-t="shuffle" style="margin-left:auto">Surprise me</button>`;
      return;
    }
    const p=this.pieces[this.sel];
    t.innerHTML=`<div class="sizerow"><label class="label" for="b-size">Size</label><input type="range" id="b-size" min="6" max="100" value="${Math.round(p.w*100)}"></div>
      <button class="btn" data-t="front">To front</button><button class="btn" data-t="back">To back</button>
      <button class="btn danger" data-t="remove">Remove</button><button class="btn ghost" data-t="done" style="margin-left:auto">Done</button>`;
  },
  tool(t){
    const p=this.pieces[this.sel];
    if(t==='shuffle'){ this.shuffle(); return }
    if(t==='bg'){ this.bgOpen=true; this.renderTools(); return }
    if(t==='bgdone'){ this.bgOpen=false; this.renderTools(); return }
    if(t==='tidy'){ this.pieces=arrange(this.pieces.map(x=>x.item)); this.sel=-1; this.renderBoard(); return }
    if(!p) return;
    if(t==='front'){ this.pieces.splice(this.sel,1); this.pieces.push(p); this.sel=this.pieces.length-1 }
    if(t==='back'){ this.pieces.splice(this.sel,1); this.pieces.unshift(p); this.sel=0 }
    if(t==='remove'){ this.pieces.splice(this.sel,1); this.sel=-1 }
    if(t==='done') this.sel=-1;
    this.renderBoard();
  },
  shuffle(){
    const by={}; Store.list().forEach(i=>{ if(i.cat&&!isWish(i))(by[i.cat]=by[i.cat]||[]).push(i) });
    const pick=c=>{const a=by[c]; return a?.length?a[Math.floor(Math.random()*a.length)]:null};
    const chosen=[];
    const useDress = by.dresses?.length && (!(by.tops?.length&&by.bottoms?.length) || Math.random()<.4);
    if(useDress) chosen.push(pick('dresses')); else { chosen.push(pick('bottoms')); chosen.push(pick('tops')) }
    if(Math.random()<.45) chosen.push(pick('outerwear'));
    chosen.push(pick('shoes'));
    if(Math.random()<.75) chosen.push(pick('bags'));
    if(Math.random()<.5) chosen.push(pick('jewellery'));
    if(Math.random()<.3) chosen.push(pick('accessories'));
    const got=chosen.filter(Boolean);
    if(got.length<2){ toast('Add a few tops, bottoms or dresses and shoes first'); return false }
    this.pieces=got.map(i=>({item:i.id,...(SLOTS[i.cat]||{x:.3,y:.3,w:.34})}));
    this.sel=-1; this.renderBoard(); return true;
  },
  renderTray(){
    const cats=$('#b-cats'), items=$('#b-items'); if(!cats) return;
    const tagged=Store.list().filter(i=>i.cat), all=tagged.filter(i=>!isWish(i)), wishes=tagged.filter(isWish), counts={};
    all.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
    if(this.trayCat==='wish'&&!wishes.length) this.trayCat='all';
    cats.innerHTML=`<button class="chip" data-tc="all" aria-pressed="${this.trayCat==='all'}">All</button>`+(wishes.length?`<button class="chip flag" data-tc="wish" aria-pressed="${this.trayCat==='wish'}">♡ Wish list</button>`:'')+CATS.filter(c=>counts[c.id]).map(c=>`<button class="chip" data-tc="${c.id}" aria-pressed="${this.trayCat===c.id}">${c.label}</button>`).join('');
    const list=this.trayCat==='wish'?wishes:all.filter(i=>this.trayCat==='all'||i.cat===this.trayCat);
    items.innerHTML=list.length?list.map(i=>`<button class="tray-item" data-add="${i.id}" aria-label="Add ${esc(itemLabel(i))}"><img src="${esc(Store.imgUrl(i.img))}" alt="" loading="lazy">${isWish(i)?'<span class="w">♡</span>':''}</button>`).join(''):`<div class="tray-empty">Tagged pieces appear here. Untagged ones are waiting in “To tag”.</div>`;
  },
  wirePointers(){
    const board=$('#b-board'); const pts=new Map(); let drag=null, pinch=null;
    const rect=()=>board.getBoundingClientRect();
    board.addEventListener('pointerdown',e=>{
      const el=e.target.closest('.piece');
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2 && this.sel>=0){
        const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:this.pieces[this.sel].w}; drag=null; return;
      }
      if(!el){ if(this.sel>=0){this.sel=-1;this.renderBoard()} return }
      const i=+el.dataset.i, p=this.pieces[i], r=rect();
      if(this.sel!==i){ this.sel=i; $$('.piece',board).forEach(x=>x.classList.toggle('sel',+x.dataset.i===i)); this.renderTools() }
      drag={i,el,dx:(e.clientX-r.left)/r.width-p.x,dy:(e.clientY-r.top)/r.height-p.y};
      this.dragging=true;
      try{board.setPointerCapture(e.pointerId)}catch(_){}
      e.preventDefault();
    });
    board.addEventListener('pointermove',e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pinch && pts.size>=2 && this.sel>=0){
        const [a,b]=[...pts.values()], p=this.pieces[this.sel];
        p.w=clamp(pinch.w*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.06,1);
        const el=board.querySelector(`.piece[data-i="${this.sel}"]`); if(el) el.style.width=p.w*100+'%';
        const sz=$('#b-size'); if(sz) sz.value=Math.round(p.w*100);
        return;
      }
      if(!drag) return;
      const r=rect(), p=this.pieces[drag.i];
      p.x=clamp((e.clientX-r.left)/r.width-drag.dx,-p.w*.6,1-p.w*.4);
      p.y=clamp((e.clientY-r.top)/r.height-drag.dy,-.2,.92);
      drag.el.style.left=p.x*100+'%'; drag.el.style.top=p.y*100+'%';
    });
    const end=e=>{pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(!pts.size){drag=null; this.dragging=false}};
    board.addEventListener('pointerup',end); board.addEventListener('pointercancel',end);
  },
  async save(){
    if(!this.pieces.length){ toast('Add at least one piece first'); return }
    const btn=$('#b-save'); btn.disabled=true;
    const existing=this.id?Store.outfits.get(this.id):null;
    const o={id:this.id||uid(),name:this.name.trim()||'Untitled outfit',occasion:this.occasion,bg:this.bg||'',pieces:this.pieces.map(p=>({item:p.item,x:+p.x.toFixed(4),y:+p.y.toFixed(4),w:+p.w.toFixed(4)})),createdAt:existing?.createdAt||Date.now(),updatedAt:Date.now()};
    try{ await Store.putOutfit(o); this.close(); S.view='outfits'; render(); toast('Outfit saved') }
    catch(e){ btn.disabled=false; toast(saveError(e)) }
  },
};

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src }) }
async function pieceImage(it){
  let url=Store.imgUrl(it.img);
  if(!url && Store.getBlob){ const b=await Store.getBlob(it.img.slice(2)) || await Sync.fetchPhoto(it.img.slice(2)); if(b) url=URL.createObjectURL(b) }
  return url?loadImg(url):null;
}
async function shareLook(pieces,{bg,name}){
  const t=toast('Preparing the picture…',0);
  try{
    const W=1080,H=1440,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
    const back=okBg(bg)||'#FFFFFF'; g.fillStyle=back; g.fillRect(0,0,W,H);
    for(const p of pieces){
      const it=Store.items.get(p.item); if(!it) continue;
      const img=await pieceImage(it).catch(()=>null); if(!img) continue;
      const w=p.w*W, h=w*img.naturalHeight/img.naturalWidth;
      g.save(); g.shadowColor='rgba(0,0,0,.16)'; g.shadowBlur=28; g.shadowOffsetY=12;
      g.drawImage(img,p.x*W,p.y*H,w,h); g.restore();
    }
    const n=parseInt(back.slice(1),16), lum=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;
    g.fillStyle=lum>0.55?'rgba(36,27,40,.85)':'rgba(255,255,255,.9)';
    try{ await document.fonts?.load('italic 500 34px "Bodoni Moda"') }catch(e){}
    g.font='500 40px "Bodoni Moda", Didot, Georgia, serif'; g.textBaseline='alphabetic';
    if(name) g.fillText(name,60,H-64);
    g.font='italic 500 30px "Bodoni Moda", Didot, Georgia, serif'; g.textAlign='right'; g.fillText('VL Atelier',W-60,H-66);
    const blob=await canvasBlob(c,'image/png');
    const file=new File([blob],`${(name||'outfit').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'outfit'}.png`,{type:'image/png'});
    t.remove();
    if(navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file],title:name||'Outfit'}) }catch(e){ if(e?.name!=='AbortError') throw e }
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
      toast('Picture saved');
    }
  }catch(e){ t.remove(); toast('The picture couldn’t be made. Try again.') }
}

/* ---------- dates, wear & money helpers ---------- */
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayKey=()=>dkey(new Date());
const keyDate=k=>new Date(k+'T12:00:00');
const fmtDay=(k,opts={weekday:'long',day:'numeric',month:'long'})=>keyDate(k).toLocaleDateString('en-GB',opts);
function dayItems(d){ if(!d) return []; const s=new Set(d.items||[]); const o=d.outfit&&Store.outfits.get(d.outfit); if(o) o.pieces.forEach(p=>s.add(p.item)); return [...s] }
function wearStats(){
  const t=todayKey(), m=new Map();
  for(const d of Store.days.values()){
    if(d.id>t) continue;
    for(const id of dayItems(d)){ const w=m.get(id)||{count:0,last:''}; w.count++; if(d.id>w.last) w.last=d.id; m.set(id,w) }
  }
  return m;
}
function priceNum(s){
  let t=String(s||'').replace(/[^\d.,]/g,''); if(!t) return null;
  if(t.includes(',')&&t.includes('.')) t=t.replace(/,/g,''); else t=t.replace(',','.');
  const n=parseFloat(t); return isFinite(n)?n:null;
}
function currency(){ for(const i of Store.items.values()){ const m=String(i.price||'').match(/[£€$]/); if(m) return m[0] } return '£' }
function money(n){ const c=currency(); return c+(n>=100?Math.round(n).toLocaleString('en-GB'):n.toFixed(2)) }
const ago90=()=>{const d=new Date(); d.setDate(d.getDate()-90); return dkey(d)};
function isStale(i){ const w=S.wear?.get(i.id); return !w || w.last<ago90() }

/* lay pieces out as a tidy flat lay, layered from the bottom up */
const LAYER=['bottoms','swim','active','lounge','tops','dresses','outerwear','shoes','bags','accessories','jewellery',''];
function arrange(ids){
  const used={};
  return ids.map(id=>Store.items.get(id)).filter(Boolean)
    .sort((a,b)=>LAYER.indexOf(a.cat||'')-LAYER.indexOf(b.cat||''))
    .map(it=>{ const s=SLOTS[it.cat]||{x:.3,y:.3,w:DEFAULT_W[it.cat||'']||.3}; const k=used[it.cat]=(used[it.cat]||0)+1;
      return {item:it.id,x:clamp(s.x+(k-1)*.08,-.1,.85),y:clamp(s.y+(k-1)*.06,-.1,.85),w:s.w} });
}
async function setDay(key,patch){
  const cur=Store.days.get(key)||{id:key,outfit:'',items:[]};
  await Store.putDay({...cur,...patch,id:key,updatedAt:Date.now()});
}
async function woreToday(itemId){
  const t=todayKey(), cur=Store.days.get(t)||{id:t,outfit:'',items:[]};
  if(dayItems(cur).includes(itemId)){ toast('Already logged for today'); return }
  try{ await setDay(t,{items:[...(cur.items||[]),itemId]}); toast('Logged for today') }catch(e){ toast(saveError(e)) }
}

/* ---------- dress me ---------- */
const DM={mode:'separates', season:'', pins:{}, sel:{}, sig:'', target:null};
const DM_ROWS={
  separates:[['outerwear','Outerwear',1,1],['tops','Top',0,1.25],['bottoms','Bottom',0,1.45],['shoes','Shoes',0,.8],['bags','Bag',1,.8]],

/* ---------- backup & restore (one JSON file with photos inside) ---------- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function backupWardrobe(){
  if(Store.mode!=='local'){ toast('Storage is blocked here, so there is nothing to back up.'); return }
  const t=toast('Preparing backup…',0);
  try{
    const blobs={};
    for(const it of Store.items.values()){
      if(!it.img?.startsWith('l:') || blobs[it.img]) continue;
      const key=it.img.slice(2);
      const blob=await Store.getBlob(key) || await Sync.fetchPhoto(key);
      if(blob) blobs[it.img]=await blobToDataURL(blob);
    }
    const data={app:'atelier',version:1,exportedAt:new Date().toISOString(),items:[...Store.items.values()],outfits:[...Store.outfits.values()],days:[...Store.days.values()],images:blobs};
    const name=`atelier-backup-${todayKey()}.json`;
    const file=new File([JSON.stringify(data)],name,{type:'application/json'});
    t.remove();
    if(navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file],title:'Atelier backup'}) }
      catch(e){ if(e?.name==='AbortError'){ toast('Backup cancelled'); return } throw e }
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    }
    toast('Backup ready — save it to iCloud Drive or Files',3600);
  }catch(e){ t.remove(); toast('The backup could not be made. Try again.') }
}
async function restoreWardrobe(file){
  let data;
  try{ data=JSON.parse(await file.text()) }catch(e){ toast('That file is not an Atelier backup.'); return }
  if(data?.app!=='atelier'||!Array.isArray(data.items)){ toast('That file is not an Atelier backup.'); return }
  if(!await confirmBox(`Restore ${data.items.length} pieces and ${(data.outfits||[]).length} outfits from ${new Date(data.exportedAt).toLocaleDateString('en-GB')}? Pieces in both are replaced by the backup copy; everything else stays.`,'Restore')) return;
  const t=toast('Restoring…',0);
  try{
    for(const [ref,url] of Object.entries(data.images||{})){
      if(!ref.startsWith('l:')) continue;
      const key=ref.slice(2), blob=await (await fetch(url)).blob();
      await Store.putBlob(key,blob); await Store.enqueue('blobs',key,'put'); Store.urls.delete(ref);
    }
    for(const it of data.items) await Store._save('items',it);
    for(const o of data.outfits||[]) await Store._save('outfits',o);
    for(const d of data.days||[]) await Store._save('days',d);
    t.remove(); closeSheet(); render(); toast('Wardrobe restored — syncing now');
  }catch(e){ t.remove(); toast('Restoring stopped partway. Try again with the same file.') }
}
$('#in-restore').onchange=e=>{const f=e.target.files[0]; e.target.value=''; if(f) restoreWardrobe(f)};

    try{ await Lock.enable(); closeSheet(); toast('Face ID lock is on') }catch(err){ toast(err?.name==='NotAllowedError'?'Face ID was cancelled — the lock is still off':'Face ID couldn’t be set up on this device') }
  });
  $('#s-pass-go',sheet).onclick=async()=>{ const p=$('#s-pass',sheet).value; if(p.length<6){ toast('Choose a password with at least 6 characters.'); return }
    const {error}=await Sync.sb.auth.updateUser({password:p}); toast(error?Auth.error(error):'Password changed'); if(!error) $('#s-pass',sheet).value='' };
  $('#s-backup',sheet).onclick=()=>{closeSheet(); backupWardrobe()};
  $('#s-restore',sheet).onclick=()=>$('#in-restore').click();
  $('#s-cu',sheet).onclick=e=>{const b=e.target.closest('[data-cu]'); if(!b) return; pref.cleanup=b.dataset.cu; $$('[data-cu]',sheet).forEach(x=>x.setAttribute('aria-pressed',x===b))};
}

/* ---------- example pieces (drawn, marked as examples) ---------- */
function drawExample(kind){
  const c=document.createElement('canvas'); c.width=c.height=600; const g=c.getContext('2d');
  g.lineJoin='round'; g.lineCap='round';
  const shape=(fill,stroke,fn)=>{g.beginPath();fn();g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=3;g.stroke()};
  if(kind==='tee'){
    const body=()=>{g.moveTo(200,90);g.quadraticCurveTo(300,140,400,90);g.lineTo(520,150);g.lineTo(480,250);g.lineTo(420,225);g.lineTo(425,510);g.lineTo(175,510);g.lineTo(180,225);g.lineTo(120,250);g.lineTo(80,150)};
    shape('#F6F4EF','#C9C3B8',body);
    g.save(); g.beginPath(); body(); g.closePath(); g.clip(); g.fillStyle='#22305A';
    for(let y=150;y<520;y+=44) g.fillRect(60,y,480,16); g.restore();
    g.beginPath(); g.moveTo(200,90); g.quadraticCurveTo(300,140,400,90); g.strokeStyle='#C9C3B8'; g.lineWidth=3; g.stroke();
  }
  if(kind==='jeans'){
    shape('#4C6E9E','#2E4A72',()=>{g.moveTo(190,70);g.lineTo(410,70);g.lineTo(445,540);g.lineTo(330,540);g.lineTo(300,210);g.lineTo(270,540);g.lineTo(155,540)});
    g.strokeStyle='#C99A4A'; g.lineWidth=2; g.setLineDash([6,6]); g.beginPath(); g.moveTo(190,110); g.lineTo(410,110); g.moveTo(300,110); g.lineTo(300,210); g.stroke(); g.setLineDash([]);
  }
  if(kind==='dress'){
    shape('#1C1A1F','#000',()=>{g.moveTo(240,60);g.lineTo(270,60);g.quadraticCurveTo(300,110,330,60);g.lineTo(360,60);g.lineTo(380,250);g.quadraticCurveTo(470,420,490,560);g.lineTo(110,560);g.quadraticCurveTo(130,420,220,250)});
  }
  if(kind==='coat'){
    shape('#B98A55','#8A6236',()=>{g.moveTo(230,50);g.lineTo(370,50);g.lineTo(470,110);g.lineTo(520,420);g.lineTo(460,425);g.lineTo(430,220);g.lineTo(440,560);g.lineTo(160,560);g.lineTo(170,220);g.lineTo(140,425);g.lineTo(80,420);g.lineTo(130,110)});
    g.strokeStyle='#8A6236'; g.lineWidth=3; g.beginPath(); g.moveTo(230,50); g.lineTo(300,250); g.lineTo(370,50); g.moveTo(300,250); g.lineTo(300,560); g.stroke();
    g.fillStyle='#6E4C2A'; [300,370,440].forEach(y=>{g.beginPath();g.arc(318,y,8,0,7);g.fill()});
  }
  if(kind==='sneaker'){
    shape('#FFFFFF','#BDB8C0',()=>{g.moveTo(80,330);g.quadraticCurveTo(110,230,200,240);g.lineTo(300,200);g.quadraticCurveTo(360,190,380,240);g.quadraticCurveTo(470,270,520,320);g.lineTo(525,370);g.lineTo(80,370)});
    shape('#E9E6EA','#BDB8C0',()=>{g.moveTo(75,370);g.lineTo(530,370);g.lineTo(528,400);g.lineTo(78,400)});
    g.strokeStyle='#3F7D4E'; g.lineWidth=10; g.beginPath(); g.moveTo(330,345); g.quadraticCurveTo(270,300,200,330); g.stroke();
  }
  if(kind==='boot'){
    shape('#3A2A22','#1F1510',()=>{g.moveTo(200,90);g.lineTo(340,90);g.lineTo(345,330);g.quadraticCurveTo(470,340,500,420);g.lineTo(500,460);g.lineTo(180,460);g.lineTo(185,330)});
    shape('#1F1510','#1F1510',()=>{g.moveTo(178,460);g.lineTo(502,460);g.lineTo(500,488);g.lineTo(240,488);g.lineTo(235,520);g.lineTo(185,520)});
  }
  if(kind==='bag'){
    g.strokeStyle='#8A6236'; g.lineWidth=14; g.beginPath(); g.moveTo(190,260); g.quadraticCurveTo(300,40,410,260); g.stroke();
    shape('#C79A63','#8A6236',()=>{g.moveTo(130,250);g.lineTo(470,250);g.quadraticCurveTo(500,250,495,290);g.lineTo(470,470);g.quadraticCurveTo(465,500,430,500);g.lineTo(170,500);g.quadraticCurveTo(135,500,130,470);g.lineTo(105,290);g.quadraticCurveTo(100,250,130,250)});
    g.fillStyle='#E3C27A'; g.fillRect(280,300,40,26);
  }
  if(kind==='hat'){
    shape('#D9C6A5','#B39A72',()=>{g.ellipse(300,380,240,70,0,0,Math.PI*2)});
    shape('#E3D2B3','#B39A72',()=>{g.moveTo(185,380);g.bezierCurveTo(185,200,415,200,415,380)});
    g.save(); g.beginPath(); g.moveTo(185,380); g.bezierCurveTo(185,200,415,200,415,380); g.closePath(); g.clip(); g.fillStyle='#6B4430'; g.fillRect(150,330,300,28); g.restore();
  }
  if(kind==='swimsuit'){
    shape('#E07B6A','#B85A4A',()=>{g.moveTo(220,70);g.lineTo(252,70);g.quadraticCurveTo(300,190,348,70);g.lineTo(380,70);g.lineTo(392,270);g.quadraticCurveTo(400,400,440,480);g.quadraticCurveTo(300,450,300,520);g.quadraticCurveTo(300,450,160,480);g.quadraticCurveTo(200,400,208,270)});
  }
  if(kind==='leggings'){
    shape('#2E2B33','#151318',()=>{g.moveTo(215,60);g.lineTo(385,60);g.lineTo(400,560);g.lineTo(325,560);g.lineTo(300,230);g.lineTo(275,560);g.lineTo(200,560)});
    g.fillStyle='#4A4652'; g.fillRect(215,60,170,26);
  }
  if(kind==='robe'){
    shape('#EAD3D6','#C9A8AE',()=>{g.moveTo(230,50);g.lineTo(370,50);g.lineTo(470,120);g.lineTo(520,330);g.lineTo(460,340);g.lineTo(430,220);g.lineTo(445,570);g.lineTo(155,570);g.lineTo(170,220);g.lineTo(140,340);g.lineTo(80,330);g.lineTo(130,120)});
    g.strokeStyle='#C9A8AE'; g.lineWidth=3; g.beginPath(); g.moveTo(230,50); g.lineTo(300,300); g.lineTo(370,50); g.moveTo(300,300); g.lineTo(330,570); g.stroke();
    g.fillStyle='#C9A8AE'; g.fillRect(168,300,264,22);
  }
  if(kind==='hoops'){
    g.strokeStyle='#C9A44C'; g.lineWidth=16; [[200,300],[400,300]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,85,0,7);g.stroke()});
    g.strokeStyle='#F2DC9A'; g.lineWidth=4; [[200,300],[400,300]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,85,3.6,4.6);g.stroke()});
  }
  return cropToAlpha(c);
}
const CAT_ICON={tops:'tee',bottoms:'jeans',dresses:'dress',outerwear:'coat',shoes:'sneaker',bags:'bag',accessories:'hat',jewellery:'hoops',swim:'swimsuit',active:'leggings',lounge:'robe'};
const catIconCache={};
function catIcon(cat){
  if(catIconCache[cat]) return catIconCache[cat];
  const k=CAT_ICON[cat]; if(!k) return '';
  try{ catIconCache[cat]=scaleCanvas(drawExample(k),160).toDataURL('image/png') }catch(e){ catIconCache[cat]='' }
  return catIconCache[cat];
}
const EXAMPLES=[
  ['tee','Striped Breton tee','tops','T-shirts',['navy','white'],['spring','summer','autumn'],['everyday']],
  ['jeans','Straight-leg jeans','bottoms','Jeans',['blue'],['spring','autumn','winter'],['everyday','work']],
  ['dress','Black slip midi','dresses','Midi dresses',['black'],['summer','spring'],['evening','special']],
  ['coat','Camel wool coat','outerwear','Coats',['camel'],['autumn','winter'],['work','everyday','evening']],
  ['sneaker','White leather trainers','shoes','Sneakers',['white','green'],['spring','summer','autumn'],['everyday','sport']],
  ['boot','Brown ankle boots','shoes','Ankle boots',['brown'],['autumn','winter'],['everyday','work']],
  ['bag','Tan shoulder bag','bags','Shoulder bags',['camel'],['spring','summer','autumn','winter'],['everyday','work']],
  ['hoops','Gold hoops','jewellery','Earrings',['gold'],['spring','summer','autumn','winter'],['everyday','evening']],
];
async function loadExamples(){
  const t=toast('Adding example pieces…',0); let k=0;
  try{
    for(const [kind,name,cat,sub,colours,seasons,occasions] of EXAMPLES){
      const ref=await Store.addImage(await exportCutout(drawExample(kind)));
      await Store.putItem({id:uid(),name,cat,sub,colours,seasons,occasions,brand:'',notes:'Example piece — remove it from Settings.',fav:false,example:true,img:ref,createdAt:Date.now()-(k++)});
    }
    t.remove(); toast('8 example pieces added. Remove them any time from Settings.',3600);
  }catch(e){ t.remove(); toast(saveError(e)) }
}

/* ---------- wiring ---------- */
$$('.tab').forEach(t=>t.onclick=()=>{S.selecting=false;S.selected.clear();S.view=t.dataset.view; render(); $('#main').scrollTop=0});
$('#btn-add').onclick=()=>{
  const sheet=openSheet('Add pieces',`
    <button class="btn primary" data-act="camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo</button>
    <button class="btn" data-act="library">Choose from photos</button>
    <button class="btn" data-act="wish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Add to wish list from a screenshot</button>
    <p class="note" style="margin:0">Choose one photo to tag it straight away, or pick several at once — they go into “To tag” to label later.</p>`);
  sheet.addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act; if(a){closeSheet(); act(a)}});
};
function act(a){
  if(a==='camera'){ S.addStatus='owned'; $('#in-camera').click() }
  if(a==='library'){ S.addStatus='owned'; $('#in-library').click() }
  if(a==='wish'){ S.addStatus='wish'; $('#in-library').click() }
  if(a==='examples') loadExamples();
  if(a==='sel-start'){ S.selecting=true; S.selected.clear(); renderWardrobe() }
  if(a==='sel-cancel'){ S.selecting=false; S.selected.clear(); renderWardrobe() }
  if(a==='sel-all'){ if(S.selected.size===S.visibleIds.length) S.selected.clear(); else S.visibleIds.forEach(id=>S.selected.add(id)); renderWardrobe() }
  if(a==='sel-delete') deleteSelected();
  if(a==='sel-tag') openBulkTag();
  if(a==='clear'){S.cat='all';S.sub=null;S.q='';$('#q').value='';S.colours.clear();S.seasons.clear();S.occasions.clear();renderFilters();render()}
}
$('#main').addEventListener('click',e=>{
  const dm=e.target.closest('[data-dm]'); if(dm){ if(dm.dataset.dm==='cancel-target'){DM.target=null;renderDressMe()} else dmAction(dm.dataset.dm); return }
  const pin=e.target.closest('[data-pin]'); if(pin){ DM.pins[pin.dataset.pin]=!DM.pins[pin.dataset.pin]; pin.setAttribute('aria-pressed',!!DM.pins[pin.dataset.pin]); return }
  const dp=e.target.closest('[data-dmpick]'); if(dp&&dp.closest('#dm-results')){ dmUse(dp.dataset.dmpick); return }
  const pr=e.target.closest('[data-pick-row]'); if(pr){ openRowPicker(pr.dataset.pickRow); return }
  const mo=e.target.closest('[data-dmmode]'); if(mo){ DM.mode=mo.dataset.dmmode; renderDressMe(); return }
  const se=e.target.closest('[data-dmseason]'); if(se){ DM.season=se.dataset.dmseason; renderDressMe(); return }
  const day=e.target.closest('[data-day]'); if(day){ openDay(day.dataset.day); return }
  const pm=e.target.closest('[data-pmonth]'); if(pm){ const d=new Date(P.y,P.m+(+pm.dataset.pmonth),1); P.y=d.getFullYear(); P.m=d.getMonth(); renderPlanner(); return }
  const go=e.target.closest('[data-goto]'); if(go){ S.view='wardrobe'; S.list='owned'; S.cat='stale'; S.sub=null; render(); $('#main').scrollTop=0; return }
  const ly=e.target.closest('[data-layout]'); if(ly){ S.layout=ly.dataset.layout; try{localStorage.setItem('atelier.layout',S.layout)}catch(_){} if(S.layout==='cats'){S.cat='all';S.sub=null} renderWardrobe(); return }
  const so=e.target.closest('[data-sort]'); if(so){ S.sort=so.dataset.sort; renderFilters(); renderWardrobe(); return }
  const a=e.target.closest('[data-act]'); if(a){act(a.dataset.act);return}
  const l=e.target.closest('[data-list]'); if(l){S.list=l.dataset.list;S.cat='all';S.sub=null;render();return}
  const c=e.target.closest('[data-cat]'); if(c){S.cat=c.dataset.cat;S.sub=null;render();return}
  const s=e.target.closest('[data-sub]'); if(s){S.sub=s.dataset.sub||null;render();return}
  const it=e.target.closest('[data-item]');
  if(it && S.selecting && it.closest('#wardrobe-body')){ const id=it.dataset.item; S.selected.has(id)?S.selected.delete(id):S.selected.add(id); renderWardrobe(); return }
  if(it){openItem(it.dataset.item);return}
  const o=e.target.closest('[data-outfit]'); if(o){openOutfit(o.dataset.outfit);return}
  const fc=e.target.closest('[data-fc]'); if(fc){const v=fc.dataset.fc; S.colours.has(v)?S.colours.delete(v):S.colours.add(v); renderFilters(); render(); return}
  const fs=e.target.closest('[data-fs]'); if(fs){const v=fs.dataset.fs; S.seasons.has(v)?S.seasons.delete(v):S.seasons.add(v); renderFilters(); render(); return}
  const fo=e.target.closest('[data-fo]'); if(fo){const v=fo.dataset.fo; S.occasions.has(v)?S.occasions.delete(v):S.occasions.add(v); renderFilters(); render(); return}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value; renderWardrobe()});
$('#dm-q').addEventListener('input',renderDmResults);
$('#btn-filters').onclick=()=>{ $('#filters').hidden=!$('#filters').hidden; renderFilters() };
$('#flt-clear').onclick=()=>{S.colours.clear();S.seasons.clear();S.occasions.clear();renderFilters();render()};
$('#btn-settings').onclick=openSettings;
$('#btn-new-outfit').onclick=()=>Builder.start(null);
$('#btn-shuffle-outfit').onclick=()=>{Builder.start(null); if(!Builder.shuffle()) Builder.close()};
function photoTargetFile(f){ const it=S.photoTarget&&Store.items.get(S.photoTarget); S.photoTarget=null; if(!it) return false; if(f) openAdd(f,isWish(it)?'wish':'owned',{edit:it}); return true }
$('#in-camera').onchange=e=>{const f=e.target.files[0]; e.target.value=''; if(photoTargetFile(f)) return; if(f) openAdd(f,'owned')};
$('#in-library').onchange=e=>{const fs=[...e.target.files]; e.target.value=''; if(photoTargetFile(fs[0])) return; if(fs.length===1) openAdd(fs[0],S.addStatus); else if(fs.length) addBatch(fs,S.addStatus)};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('.confirm')) return; if(layer.firstElementChild) closeSheet(); else if(Builder.open) Builder.close() } });

$('#dm-seasons').innerHTML=[['','Any season'],...SEASONS].map(([v,l])=>`<button type="button" class="chip" data-dmseason="${v}">${l}</button>`).join('');

Lock.check();

window.addEventListener('online',()=>Sync.soon(300));
setInterval(()=>{ if(!document.hidden) Sync.run() },60000);
(async()=>{
  renderFilters();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  let last=null; try{ last=JSON.parse(localStorage.getItem('atelier.lastUser')||'null') }catch(e){}
  if(window.supabase?.createClient){
    Sync.sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'atelier-auth'}});
    let session=null;
    try{ session=(await Sync.sb.auth.getSession()).data.session }catch(e){}
    if(session){ await enterApp(session.user); return }
  }
  if(last && !navigator.onLine){ await Store.start(last.id,last.email); render(); renderSyncNote(); return }

})();
